# Deploy —— 发布到 GitHub Releases（自动部署）
#
# 触发时机：
#   - 推送版本标签 v*（例如 v0.4.0）
#   - 手动触发（workflow_dispatch）
#
# 流程：
#   1. 校验标签与 package.json 版本一致（仅 tag 触发时）
#   2. 可选：从 Secret 还原 Authenticode 签名证书（.pfx）
#   3. 门禁：类型检查 → 单元测试 → 打包 → E2E → E2E 覆盖率门禁
#   4. electron-forge publish 上传至 GitHub Releases（草稿 draft）
#   5. 记录发布资产 SHA-256 校验和作为证据产物
#
# 需要配置的 Secret（仓库 Settings → Secrets）：
#   - 可选 WMB_WINDOWS_CERTIFICATE_BASE64：base64 编码的 .pfx 证书
#   - 可选 WMB_WINDOWS_CERTIFICATE_PASSWORD：证书密码
#   未配置时自动发布「未签名」安装包并给出警告。
#
# 说明：仓库已通过 forge.config.ts 的 PublisherGithub 配置发布到
#       PigeonAI-Yang/wemediabuddy（draft: true, prerelease: false）。

name: Deploy — Windows 发布

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 发布需要写仓库内容（创建 Release 与上传资产）
permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    name: 构建安装包并发布
    runs-on: windows-latest
    timeout-minutes: 90
    environment: release
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WMB_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WMB_WINDOWS_CERTIFICATE_PASSWORD }}
      WMB_OUT_DIR: ${{ github.workspace }}/wmb-out
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装锁定版本依赖
        run: npm ci

      - name: 校验标签与 package 版本一致
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "标签 $env:GITHUB_REF_NAME 与 package 版本 v$version 不一致。"
          }

      - name: 还原签名证书（如已配置）
        shell: pwsh
        env:
          WMB_WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WMB_WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          if (-not $env:WMB_WINDOWS_CERTIFICATE_BASE64 -and -not $env:WMB_WINDOWS_CERTIFICATE_PASSWORD) {
            Write-Warning '未配置 Authenticode 证书，将发布未签名安装包。'
            "WMB_RELEASE_UNSIGNED=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            return
          }
          if (-not $env:WMB_WINDOWS_CERTIFICATE_BASE64 -or -not $env:WMB_WINDOWS_CERTIFICATE_PASSWORD) {
            throw '请同时配置 WMB_WINDOWS_CERTIFICATE_BASE64 与 WMB_WINDOWS_CERTIFICATE_PASSWORD，或两者都不配置。'
          }
          $certificate = Join-Path $env:RUNNER_TEMP 'wemediabuddy-release.pfx'
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WMB_WINDOWS_CERTIFICATE_BASE64))
          "WMB_WINDOWS_CERTIFICATE_FILE=$certificate" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 运行发布门禁（类型检查 / 单元测试 / 打包 / E2E）
        shell: pwsh
        run: |
          npm run typecheck
          npm test
          npm run package
          npm run e2e
          npm run e2e:gate

      - name: 构建安装包并上传为草稿 Release
        run: npm run publish

      - name: 记录发布资产 SHA-256 校验和
        shell: pwsh
        run: |
          $assets = Get-ChildItem (Join-Path $env:WMB_OUT_DIR 'make') -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.nupkg' -or $_.Name -eq 'RELEASES' }
          if (-not $assets) { throw '未生成 Squirrel.Windows 发布资产。' }
          $lines = foreach ($asset in $assets) {
            $hash = (Get-FileHash $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetRelativePath((Join-Path $env:WMB_OUT_DIR 'make'), $asset.FullName))"
          }
          $lines | Set-Content release-assets.sha256 -Encoding utf8
          Get-Content release-assets.sha256

      - name: 上传校验和证据
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-checksums
          path: release-assets.sha256
          if-no-files-found: error
          retention-days: 90

      - name: 清理签名证书
        if: always()
        shell: pwsh
        run: |
          if ($env:WMB_WINDOWS_CERTIFICATE_FILE) {
            Remove-Item $env:WMB_WINDOWS_CERTIFICATE_FILE -Force -ErrorAction SilentlyContinue
          }
