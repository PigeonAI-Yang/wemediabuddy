<style>
  /* ============================================================
   * Editorial Terminal — interactive starting point.
   * All colors/spacing/motion via tokens; nothing below is a
   * product component, only kit scaffolding over ds-* primitives.
   * ============================================================ */
  body { margin: 0; background: var(--app-bg); color: var(--ink); font-family: var(--font-sans); }
  #demo-root { height: 100vh; }
  .edt-shell { position: relative; }
  .edt-shell .ds-brand .wmb-creature-mark { width: 22px; height: 22px; }
  .edt-shell .ds-titlebar-actions .ds-icon-button { width: 46px; height: 100%; border: 0; border-radius: 0; background: transparent; }
  .edt-shell .ds-titlebar-actions .ds-icon-button:hover:not(:disabled) { background: var(--surface-hover); }
  .edt-shell .ds-titlebar-actions .ds-window-close:hover { background: var(--danger); color: var(--accent-ink); }

  /* Pi = non-resizing overlay: opening never subtracts from the
     workspace column (WMB-5258 §6). */
  .edt-shell.ds-shell--pi-overlay { --pi-width: 0px; }
  .edt-shell.ds-shell--pi-overlay .ds-pi-dock {
    position: absolute;
    inset: var(--topbar-height) 0 var(--status-height) auto;
    width: var(--pi-open-width);
    max-width: 100%;
    z-index: 1500;
    border-left: 1px solid var(--border-strong);
    box-shadow: var(--shadow-modal);
    animation: edt-pi-in var(--dur-expand) var(--ease-out-expo);
  }
  @keyframes edt-pi-in { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .edt-shell.ds-shell--pi-overlay .ds-pi-dock { animation: none; } }

  .edt-room { height: 100%; }
  .edt-room .ds-page { padding: var(--page-space); }
  .edt-stack { display: grid; gap: 8px; align-content: start; }
  .edt-side { display: grid; gap: 12px; align-content: start; }
  .edt-card { padding: 14px 16px; border: 1px solid var(--border-soft); border-radius: var(--radius-xl); background: var(--surface); }
  .edt-card h3 { margin: 0 0 8px; font-size: 13px; font-weight: var(--weight-semibold); color: var(--ink-soft); }
  .edt-card p { margin: 0; color: var(--muted); font-size: 12.5px; line-height: 1.55; }
  .edt-meta { display: grid; grid-template-columns: 96px 1fr; gap: 6px 12px; margin: 0; padding-top: 10px; border-top: 1px solid var(--line); font-size: 13px; }
  .edt-meta dt { color: var(--muted); }
  .edt-meta dd { margin: 0; color: var(--ink-soft); }
  .edt-actions { display: flex; gap: 8px; margin-top: 12px; }
  .edt-role-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .edt-role-grid .ds-role-card { min-height: 208px; }
  .edt-role-grid .ds-role-card__avatar { width: 88px; height: 88px; font-size: 28px; }
  .edt-note { margin: 14px 0 0; padding: 10px 12px; border-radius: var(--radius-lg); background: var(--tag-bg); color: var(--muted); font-size: 12.5px; line-height: 1.55; }
  .edt-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 720px; }
  @media (max-width: 720px) { .edt-fields { grid-template-columns: 1fr; } }
  .edt-pane-list { display: grid; gap: 8px; }
  .edt-pane-item { padding: 10px 12px; border: 1px solid var(--border-soft); border-radius: var(--radius-lg); background: var(--surface); font-size: 12.5px; color: var(--ink-soft); line-height: 1.5; }
  .edt-reading { max-width: 1080px; margin: 0 auto; padding: var(--page-space) var(--page-space) 64px; }
</style>
