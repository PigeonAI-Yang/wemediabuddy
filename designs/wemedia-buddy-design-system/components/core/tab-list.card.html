<!-- @dsCard group="Components" viewport="700x170" name="TabList" -->
<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8"/>
<title>TabList</title>
<link rel="stylesheet" href="../../styles.css"/>
<style>
  body { padding: 18px 20px 0; background: var(--app-bg); color: var(--ink); font-family: var(--font-sans); }
  .panel { padding: 14px 2px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div id="demo-root"></div>
<script src="../../_ds_bundle.js"></script>
<script>
(function () {
  var scripts = document.getElementsByTagName('script');
  var rootUrl = '';
  for (var i = 0; i < scripts.length; i++) {
    var src = scripts[i].getAttribute('src') || '';
    if (src.indexOf('_ds_bundle.js') !== -1) { rootUrl = src.slice(0, -'_ds_bundle.js'.length); break; }
  }
  var ns = null;
  for (var key in window) { if (/^WemediaBuddyDesignSystem_[0-9a-f]{6}$/.test(key)) { ns = key; break; } }
  if (!ns && window.location.protocol !== 'file:') {
    try {
      var req = new XMLHttpRequest();
      req.open('GET', rootUrl + '_ds_manifest.json', false);
      req.send(null);
      var parsed = JSON.parse(req.responseText);
      if (parsed && parsed.namespace && window[parsed.namespace]) ns = parsed.namespace;
    } catch (e) { ns = null; }
  }
  window.__dsNs = ns;
})();
</script>
<script>
(function () {
  var R = window.React;
  var RD = window.ReactDOM;
  var ns = window.__dsNs;
  var host = document.getElementById('demo-root');
  if (!ns || !R || !RD) { host.textContent = 'Design-system bundle not compiled yet (run compile-design-system.mjs).'; return; }
  var C = window[ns];
  var el = R.createElement;
  var tabs = [
    { id: 'today', label: '今日可批', count: 3 },
    { id: 'shelved', label: '待处理', count: 9 },
    { id: 'approved', label: '已批' }
  ];
  var App = function () {
    var state = R.useState('today');
    var selected = state[0];
    var setSelected = state[1];
    return el('div', null,
      el(C.TabList, { tabs: tabs, selectedId: selected, onSelect: setSelected, ariaLabel: '选题台账' }),
      el('div', { className: 'panel', role: 'tabpanel', id: 'tabpanel-' + selected },
        '键盘：←/→ 切换 · Home/End 到首尾 · Tab 进入'
      )
    );
  };
  var node = el(App);
  var root = null;
  if (RD.createRoot) {
    root = RD.createRoot(host);
    if (RD.flushSync) { RD.flushSync(function () { root.render(node); }); }
    else { root.render(node); }
  } else {
    RD.render(node, host);
  }
})();
</script>
</body>
</html>
