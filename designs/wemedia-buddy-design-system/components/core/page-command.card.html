<!-- @dsCard group="Components" viewport="700x180" name="PageCommand" -->
<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8"/>
<title>PageCommand</title>
<link rel="stylesheet" href="../../styles.css"/>
<style>
  body { padding: 18px 20px; background: var(--app-bg); color: var(--ink); font-family: var(--font-sans); }
</style>
</head>
<body>
<div id="demo-root"></div>
<script src="../../_ds_bundle.js"></script>
<script>
(function () {
  var scripts = document.getElementsByTagName('script');
  var rootUrl = '';
  for (var i = 0; i < scripts.length; i++) {
    var src = scripts[i].getAttribute('src') || '';
    if (src.indexOf('_ds_bundle.js') !== -1) { rootUrl = src.slice(0, -'_ds_bundle.js'.length); break; }
  }
  var ns = null;
  for (var key in window) { if (/^WemediaBuddyDesignSystem_[0-9a-f]{6}$/.test(key)) { ns = key; break; } }
  if (!ns && window.location.protocol !== 'file:') {
    try {
      var req = new XMLHttpRequest();
      req.open('GET', rootUrl + '_ds_manifest.json', false);
      req.send(null);
      var parsed = JSON.parse(req.responseText);
      if (parsed && parsed.namespace && window[parsed.namespace]) ns = parsed.namespace;
    } catch (e) { ns = null; }
  }
  window.__dsNs = ns;
})();
</script>
<script>
(function () {
  var R = window.React;
  var RD = window.ReactDOM;
  var ns = window.__dsNs;
  var host = document.getElementById('demo-root');
  if (!ns || !R || !RD) { host.textContent = 'Design-system bundle not compiled yet (run compile-design-system.mjs).'; return; }
  var C = window[ns];
  var el = R.createElement;
  var node = el('div', null,
    el(C.PageCommand, {
      title: '选题台账',
      summary: '今日值得批的方案',
      stats: [
        { key: 'today', label: '今日可批', value: 3, active: true },
        { key: 'shelved', label: '待处理', value: 9 },
        { key: 'approved', label: '已批', value: 21 }
      ],
      actions: [
        { label: '新建选题', variant: 'primary' },
        { label: '批量操作' }
      ]
    })
  );
  var root = null;
  if (RD.createRoot) {
    root = RD.createRoot(host);
    if (RD.flushSync) { RD.flushSync(function () { root.render(node); }); }
    else { root.render(node); }
  } else {
    RD.render(node, host);
  }
})();
</script>
</body>
</html>
