<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;background:#17151A;font-family:"Microsoft YaHei UI",system-ui,sans-serif;color:#F4F1EE}
  .wrap{width:1180px;padding:30px 34px}
  h1{font-size:24px;margin:0 0 6px;font-weight:600}
  .hint{font-size:14px;color:#B9B3C4;margin:0 0 22px}
  .row{display:flex;gap:28px}
  .lane{flex:1;display:flex;flex-direction:column;align-items:center;gap:12px;background:#211D29;border-radius:18px;padding:20px 14px}
  .big{width:260px;height:260px;background:#F4F1EE;border-radius:16px;display:flex;align-items:center;justify-content:center}
  .big img{width:240px;height:240px}
  .small{display:flex;align-items:flex-end;gap:22px}
  .s64 img{width:64px;height:64px}.s16 img{width:16px;height:16px}
  .s64,.s16{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:#8A8090}
  .name{font-size:17px;font-weight:600}
  .desc{font-size:12px;color:#B9B3C4;text-align:center;line-height:1.6}
</style></head><body>
<div class="wrap">
  <h1>美学车道打样 · 桌助熊 × 3 车道</h1>
  <p class="hint">同一只熊、同一构图，只变美学系统。选定车道后才量产全家。</p>
  <div class="row">
    <div class="lane">
      <div class="big"><img src="L1-minimal-line.svg"></div>
      <div class="small"><div class="s64"><img src="L1-minimal-line.svg">64px</div><div class="s16"><img src="L1-minimal-line.svg">16px</div></div>
      <div class="name">L1 · 极简淡线</div>
      <div class="desc">奶白 + 细棕描边，小五官<br>Chiikawa/Line 系，最干净最耐看</div>
    </div>
    <div class="lane">
      <div class="big"><img src="L2-cream-flat.svg"></div>
      <div class="small"><div class="s64"><img src="L2-cream-flat.svg">64px</div><div class="s16"><img src="L2-cream-flat.svg">16px</div></div>
      <div class="name">L2 · 奶油平涂</div>
      <div class="desc">自然熊棕 + 奶白嘴套，零描边零渐变零腮红<br>Kakao Ryan 系，沉稳大色块</div>
    </div>
    <div class="lane">
      <div class="big"><img src="L3-bold-sticker.svg"></div>
      <div class="small"><div class="s64"><img src="L3-bold-sticker.svg">64px</div><div class="s16"><img src="L3-bold-sticker.svg">16px</div></div>
      <div class="name">L3 · 粗描边贴纸</div>
      <div class="desc">深炭粗描边 + 大眼张嘴笑 + 粉耳心<br>Mofusand 系，表情最有戏</div>
    </div>
  </div>
</div>
</body></html>
