<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;background:#17151A;font-family:"Microsoft YaHei UI",system-ui,sans-serif}
  .wrap{width:1640px;padding:40px 0 36px;display:flex;flex-direction:column;align-items:center;gap:28px}
  h1{color:#F4F1EE;font-size:30px;font-weight:600;margin:0;letter-spacing:2px}
  .row{display:flex;gap:28px}
  .cell{display:flex;flex-direction:column;align-items:center;gap:14px}
  .tile{width:280px;height:280px;background:#F4F1EE;border-radius:36px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .tile img{width:256px;height:256px;object-fit:contain}
  .cap{color:#B9B3C4;font-size:18px;letter-spacing:1px}
</style></head><body>
<div class="wrap">
  <h1>WeMediaBuddy 班组吉祥物 · E 动物混合族（深化稿）</h1>
  <div class="row">
    <div class="cell"><div class="tile"><img src="desk-bear/png/avatar/640.png"></div><div class="cap">桌助 · 熊</div></div>
    <div class="cell"><div class="tile"><img src="reporter-rabbit/png/avatar/640.png"></div><div class="cap">记者 · 兔</div></div>
    <div class="cell"><div class="tile"><img src="planner-owl/png/avatar/640.png"></div><div class="cap">策划 · 鸮</div></div>
    <div class="cell"><div class="tile"><img src="writer-cat/png/avatar/640.png"></div><div class="cap">写手 · 猫</div></div>
    <div class="cell"><div class="tile"><img src="librarian-hedgehog/png/avatar/640.png"></div><div class="cap">资料员 · 刺猬</div></div>
  </div>
</div>
</body></html>
