<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;background:#17151A;font-family:"Microsoft YaHei UI",system-ui,sans-serif;color:#F4F1EE}
  .wrap{width:1240px;padding:36px 30px}
  h1{font-size:24px;margin:0 0 24px;font-weight:600}
  .row{display:flex;gap:24px}
  .cell{display:flex;flex-direction:column;align-items:center;gap:10px}
  .tile{background:#211D29;border:1px solid #3A3542;border-radius:20px;display:flex;align-items:center;justify-content:center}
  .t64{width:140px;height:140px}.t64 img{width:64px;height:64px}
  .t16{width:140px;height:80px}.t16 img{width:16px;height:16px}
  .tag{font-size:13px;color:#B9B3C4}
</style></head><body>
<div class="wrap">
  <h1>单色反白测试 · glyph 白色版 on 深色底</h1>
  <div class="row">
    <div class="cell"><div class="tile t64"><img src="desk-bear-glyph-white.svg"></div><div class="tag">桌助熊 64px</div></div>
    <div class="cell"><div class="tile t64"><img src="reporter-rabbit-glyph-white.svg"></div><div class="tag">记者兔 64px</div></div>
    <div class="cell"><div class="tile t64"><img src="planner-owl-glyph-white.svg"></div><div class="tag">策划鸮 64px</div></div>
    <div class="cell"><div class="tile t64"><img src="writer-cat-glyph-white.svg"></div><div class="tag">写手猫 64px</div></div>
    <div class="cell"><div class="tile t64"><img src="librarian-hedgehog-glyph-white.svg"></div><div class="tag">资料员刺猬 64px</div></div>
  </div>
  <div class="row" style="margin-top:18px">
    <div class="cell"><div class="tile t16"><img src="desk-bear-glyph-white.svg"></div><div class="tag">16px</div></div>
    <div class="cell"><div class="tile t16"><img src="reporter-rabbit-glyph-white.svg"></div><div class="tag">16px</div></div>
    <div class="cell"><div class="tile t16"><img src="planner-owl-glyph-white.svg"></div><div class="tag">16px</div></div>
    <div class="cell"><div class="tile t16"><img src="writer-cat-glyph-white.svg"></div><div class="tag">16px</div></div>
    <div class="cell"><div class="tile t16"><img src="librarian-hedgehog-glyph-white.svg"></div><div class="tag">16px</div></div>
  </div>
</div>
</body></html>
