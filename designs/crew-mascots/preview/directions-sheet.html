<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;background:#17151A;font-family:"Microsoft YaHei UI",system-ui,sans-serif;color:#F4F1EE}
  .wrap{width:1320px;padding:34px 30px 20px}
  h1{font-size:26px;margin:0 0 6px;font-weight:600}
  .sub{color:#8B8598;font-size:14px;margin-bottom:22px}
  .row{display:flex;align-items:center;gap:22px;padding:14px 0;border-top:1px solid #2A2631}
  .dname{width:150px;flex:none}
  .dname .zh{font-size:19px;font-weight:600}
  .dname .en{font-size:12px;color:#8B8598;margin-top:4px}
  .cell{background:#F4F1EE;border-radius:18px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .full{width:760px;height:196px}
  .full img{width:735px}
  .mid{width:280px;height:86px}
  .mid img{width:268px}
  .tiny{width:150px;height:56px}
  .tiny img{width:112px}
  .tag{font-size:11px;color:#8B8598;text-align:center;margin-top:6px}
</style></head><body>
<div class="wrap">
  <h1>班组吉祥物 · 方向发散（剪影级粗稿）</h1>
  <div class="sub">五角色顺序：桌助 / 记者 / 策划 / 写手 / 资料员　·　右两列为小尺寸测试（≈64px 与 ≈16px/只）</div>
  <div class="row">
    <div class="dname"><div class="zh">A · 终端机器人族</div><div class="en">五形体：方/高/圆/窄/扁 + 职能天线</div></div>
    <div><div class="cell full"><img src="../directions/A-robots.svg"></div></div>
    <div><div class="cell mid"><img src="../directions/A-robots.svg"></div><div class="tag">64px/只</div></div>
    <div><div class="cell tiny"><img src="../directions/A-robots.svg"></div><div class="tag">16px/只</div></div>
  </div>
  <div class="row">
    <div class="dname"><div class="zh">B · 猫头鹰族</div><div class="en">五体型鸮 + 耳羽/泡泡/翎毛差异</div></div>
    <div><div class="cell full"><img src="../directions/B-owls.svg"></div></div>
    <div><div class="cell mid"><img src="../directions/B-owls.svg"></div><div class="tag">64px/只</div></div>
    <div><div class="cell tiny"><img src="../directions/B-owls.svg"></div><div class="tag">16px/只</div></div>
  </div>
  <div class="row">
    <div class="dname"><div class="zh">C · 蛋仔鸟族</div><div class="en">五种蛋形比例 + 呆毛变体</div></div>
    <div><div class="cell full"><img src="../directions/C-eggs.svg"></div></div>
    <div><div class="cell mid"><img src="../directions/C-eggs.svg"></div><div class="tag">64px/只</div></div>
    <div><div class="cell tiny"><img src="../directions/C-eggs.svg"></div><div class="tag">16px/只</div></div>
  </div>
  <div class="row">
    <div class="dname"><div class="zh">D · 几何精灵族</div><div class="en">极简几何体 + 悬浮单配件</div></div>
    <div><div class="cell full"><img src="../directions/D-geometric.svg"></div></div>
    <div><div class="cell mid"><img src="../directions/D-geometric.svg"></div><div class="tag">64px/只</div></div>
    <div><div class="cell tiny"><img src="../directions/D-geometric.svg"></div><div class="tag">16px/只</div></div>
  </div>
  <div class="row">
    <div class="dname"><div class="zh">E · 动物混合族</div><div class="en">熊/兔/鸮/猫/刺猬，五物种头像</div></div>
    <div><div class="cell full"><img src="../directions/E-animals.svg"></div></div>
    <div><div class="cell mid"><img src="../directions/E-animals.svg"></div><div class="tag">64px/只</div></div>
    <div><div class="cell tiny"><img src="../directions/E-animals.svg"></div><div class="tag">16px/只</div></div>
  </div>
</div>
</body></html>
