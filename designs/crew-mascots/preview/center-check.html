<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;background:#17151A;font-family:"Microsoft YaHei UI",system-ui,sans-serif;color:#F4F1EE}
  .wrap{width:1560px;padding:30px}
  h1{font-size:22px;margin:0 0 20px;font-weight:600}
  .row{display:flex;gap:24px}
  .cell{display:flex;flex-direction:column;align-items:center;gap:8px}
  .tile{position:relative;width:280px;height:280px;background:#F4F1EE;border-radius:18px;overflow:hidden}
  .tile img{width:280px;height:280px;display:block}
  .ch{position:absolute;background:rgba(255,0,0,.85);pointer-events:none}
  .v{left:50%;top:0;width:1px;height:100%}
  .h{top:50%;left:0;height:1px;width:100%}
  .tag{font-size:13px;color:#B9B3C4}
</style></head><body>
<div class="wrap">
  <h1>居中校验 · 十字线 = 画布 50%/50%</h1>
  <div class="row">
    <div class="cell"><div class="tile"><img src="../dist/wmb-desk-bear/png/avatar/400.png"><div class="ch v"></div><div class="ch h"></div></div><div class="tag">桌助熊</div></div>
    <div class="cell"><div class="tile"><img src="../dist/wmb-reporter-rabbit/png/avatar/400.png"><div class="ch v"></div><div class="ch h"></div></div><div class="tag">记者兔</div></div>
    <div class="cell"><div class="tile"><img src="../dist/wmb-planner-owl/png/avatar/400.png"><div class="ch v"></div><div class="ch h"></div></div><div class="tag">策划鸮</div></div>
    <div class="cell"><div class="tile"><img src="../dist/wmb-writer-cat/png/avatar/400.png"><div class="ch v"></div><div class="ch h"></div></div><div class="tag">写手猫</div></div>
    <div class="cell"><div class="tile"><img src="../dist/wmb-librarian-hedgehog/png/avatar/400.png"><div class="ch v"></div><div class="ch h"></div></div><div class="tag">资料员刺猬</div></div>
  </div>
</div>
</body></html>
