<text x="22" y="453" font-size="7.5" fill="#8A7E74">五角色同车道共享同一描边、同一质感与同一用色逻辑；物种仅靠顶部轮廓（圆耳/长耳/角羽/尖耳/刺背）与受控角色色区分，未改变 A 头身结构。</text>
<rect x="12" y="552" width="1000" height="78" rx="12" fill="#F5F5F3" stroke="#111" stroke-width="1"/>
<text x="18" y="572" font-size="10.5" fill="#111"><tspan font-weight="800">主张：</tspan><tspan fill="#222">以同一徽章母形+奶油粉彩与柔和表情完成家族统一，顶部轮廓做物种区分。</tspan></text>
<text x="18" y="590" font-size="10" fill="#2B2B2B"><tspan font-weight="700" fill="#111">适配：</tspan>暖调粉彩与深棕线框让桌面头像温和可亲，哑光平涂适配 WeMediaBuddy 克制的专业基调。</text>
<text x="18" y="608" font-size="10" fill="#6B6B6B"><tspan font-weight="700" fill="#111">风险：</tspan>粉彩在强光屏与纯白底间对比偏弱，需在 64px 下控饱和谐，确保深棕描边不丢；品牌强调色仅作点缀，未主导。</text>
