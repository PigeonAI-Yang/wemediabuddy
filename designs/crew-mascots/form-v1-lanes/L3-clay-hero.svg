<rect x="12" y="390" width="1000" height="22" rx="8" fill="#FFFFFF" stroke="#E8E0D8" stroke-width="1"/>
<text x="22" y="404" font-size="7.2" fill="#AAA">↓ 预览仅示意 · 真实 64px / 圆形 / 顶栏验证见独立场景文件（grid64 / circle / bar32）</text>
<rect x="12" y="418" width="1000" height="48" rx="12" fill="#FAFAF8" stroke="#E8E0D8" stroke-width="1"/>
<text x="22" y="436" font-size="8.2" fill="#888" font-weight="700">形/线/色/质/构成一致选择 · 渐变+高光 · 贴纸白边</text>
<text x="22" y="453" font-size="7.5" fill="#8A7E74">五角色同车道共享同一描边、同一质感与同一用色逻辑；物种仅靠顶部轮廓（圆耳/长耳/角羽/尖耳/刺背）与受控角色色区分，未改变 A 头身结构。</text>
<rect x="12" y="552" width="1000" height="78" rx="12" fill="#F5F5F3" stroke="#111" stroke-width="1"/>
<text x="18" y="572" font-size="10.5" fill="#111"><tspan font-weight="800">主张：</tspan><tspan fill="#222">以粗描边贴纸统一触感，用柔和体积渐变与克制高光做出软陶体积，保留顶部轮廓区分。</tspan></text>
<text x="18" y="590" font-size="10" fill="#2B2B2B"><tspan font-weight="700" fill="#111">适配：</tspan>贴纸白边让 64px/圆形场景天然悬浮，体积感增强可感性而不过萌。</text>
<text x="18" y="608" font-size="10" fill="#6B6B6B"><tspan font-weight="700" fill="#111">风险：</tspan>渐变与白边在 16px 会增视觉噪点，需靠粗外轮廓兜住剪影；打印/单色场景需退化到平涂。</text>
</svg>