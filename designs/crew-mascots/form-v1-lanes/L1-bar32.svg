<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 96" role="img" width="720" height="96">
<title>L1 · 奶油描边 · 顶栏 32px + 16px 实况</title>
<style>text{font-family:ui-sans,system-ui,"PingFang SC","Microsoft YaHei",sans-serif}</style>

<rect width="720" height="96" fill="#FFFFFF" rx="10" stroke="#E8E0D8" stroke-width="1"/>
<text x="12" y="14" font-size="7.5" fill="#888" font-weight="700">顶栏实况 · 同锚点A · 32px 与 16px 真实尺寸 · SVG 内明确标注</text>
<!-- 32px bar -->
<rect x="12" y="20" width="696" height="32" rx="10" fill="#FAFAF8" stroke="#E8E0D8" stroke-width="1"/>
<text x="18" y="28" font-size="6.5" fill="#AAA" font-weight="600">32px</text>
<g transform="translate(18,30)"><circle cx="14" cy="14" r="12" fill="#F7D9A6" stroke="#3D2415" stroke-width="1.6"/><circle cx="8.5" cy="8" r="2.6" fill="#F7D9A6" stroke="#3D2415" stroke-width="1"/><circle cx="19.5" cy="8" r="2.6" fill="#F7D9A6" stroke="#3D2415" stroke-width="1"/></g><g transform="translate(50,30)"><circle cx="14" cy="14" r="12" fill="#FBD8CC" stroke="#3D2415" stroke-width="1.6"/><ellipse cx="9" cy="7" rx="2.2" ry="6" fill="#FBD8CC" stroke="#3D2415" stroke-width="1"/><ellipse cx="19" cy="7" rx="2.2" ry="6" fill="#FBD8CC" stroke="#3D2415" stroke-width="1"/></g><g transform="translate(82,30)"><circle cx="14" cy="14" r="12" fill="#EDE6B8" stroke="#3D2415" stroke-width="1.6"/><path d="M6 7 L8 2.5 L11 7 Z" fill="#EDE6B8" stroke="#3D2415" stroke-width="1" stroke-linejoin="round"/><path d="M17 7 L19 2.5 L22 7 Z" fill="#EDE6B8" stroke="#3D2415" stroke-width="1" stroke-linejoin="round"/></g><g transform="translate(114,30)"><circle cx="14" cy="14" r="12" fill="#F0E6D8" stroke="#3D2415" stroke-width="1.6"/><path d="M6 8 L8 3 L11 8 Z" fill="#F0E6D8" stroke="#3D2415" stroke-width="1" stroke-linejoin="round"/><path d="M17 8 L19 3 L22 8 Z" fill="#F0E6D8" stroke="#3D2415" stroke-width="1" stroke-linejoin="round"/></g><g transform="translate(146,30)"><circle cx="14" cy="14" r="12" fill="#E8D0B8" stroke="#3D2415" stroke-width="1.6"/><path d="M4 13 Q14 4 24 13" fill="#E8D0B8" stroke="#3D2415" stroke-width="1" stroke-linejoin="round"/></g>
<text x="200" y="40" font-size="7" fill="#888">32px 顶栏混排 · 熊 兔 鸮 猫 刺猬 · 轮廓互分</text>
<text x="420" y="40" font-size="6.5" fill="#B0A9A0">32px · 真实 24px 头像圆 · 描边/色块清晰</text>
<rect x="580" y="28" width="68" height="16" rx="8" fill="#111"/><text x="614" y="38.5" text-anchor="middle" font-size="6.5" fill="#fff" font-weight="700">去批选题</text>
<!-- 16px bar -->
<rect x="12" y="58" width="696" height="28" rx="10" fill="#FFFFFF" stroke="#DDD6CF" stroke-width="0.8"/>
<text x="18" y="66" font-size="6.5" fill="#AAA" font-weight="600">16px</text>
<g transform="translate(18,68)"><circle cx="8" cy="8" r="7.5" fill="#F7D9A6" stroke="#3D2415" stroke-width="1.1"/><circle cx="5" cy="5" r="1.6" fill="#F7D9A6" stroke="#3D2415" stroke-width="0.8"/><circle cx="11" cy="5" r="1.6" fill="#F7D9A6" stroke="#3D2415" stroke-width="0.8"/></g><g transform="translate(40,68)"><circle cx="8" cy="8" r="7.5" fill="#FBD8CC" stroke="#3D2415" stroke-width="1.1"/><ellipse cx="5.5" cy="4.2" rx="1.4" ry="3.6" fill="#FBD8CC" stroke="#3D2415" stroke-width="0.8"/><ellipse cx="10.5" cy="4.2" rx="1.4" ry="3.6" fill="#FBD8CC" stroke="#3D2415" stroke-width="0.8"/></g><g transform="translate(62,68)"><circle cx="8" cy="8" r="7.5" fill="#EDE6B8" stroke="#3D2415" stroke-width="1.1"/><path d="M3.5 4 L5 1.5 L6.5 4 Z" fill="#EDE6B8" stroke="#3D2415" stroke-width="0.8" stroke-linejoin="round"/><path d="M9.5 4 L11 1.5 L12.5 4 Z" fill="#EDE6B8" stroke="#3D2415" stroke-width="0.8" stroke-linejoin="round"/></g><g transform="translate(84,68)"><circle cx="8" cy="8" r="7.5" fill="#F0E6D8" stroke="#3D2415" stroke-width="1.1"/><path d="M3.5 4.5 L5 1.8 L6.5 4.5 Z" fill="#F0E6D8" stroke="#3D2415" stroke-width="0.8" stroke-linejoin="round"/><path d="M9.5 4.5 L11 1.8 L12.5 4.5 Z" fill="#F0E6D8" stroke="#3D2415" stroke-width="0.8" stroke-linejoin="round"/></g><g transform="translate(106,68)"><circle cx="8" cy="8" r="7.5" fill="#E8D0B8" stroke="#3D2415" stroke-width="1.1"/><path d="M2.5 7.5 Q8 1.5 13.5 7.5" fill="#E8D0B8" stroke="#3D2415" stroke-width="0.8" stroke-linejoin="round"/></g>
<text x="160" y="76" font-size="6.5" fill="#888">16px 顶栏 · 极小尺寸 glyph 实况 · 同形等比缩放至 15px 圆</text>
<text x="420" y="76" font-size="6" fill="#B0A9A0">16px · 圆/耳/刺背仍可辨 · 深棕描边兜住</text>
<rect x="580" y="64" width="68" height="14" rx="7" fill="#111"/><text x="614" y="73" text-anchor="middle" font-size="6" fill="#fff" font-weight="700">去批选题</text>
<!-- annotation -->
<g font-size="6" fill="#AAA"><text x="12" y="92" >标注：上排 32px / 下排 16px · 同锚点A外轮廓占比一致 · 仅线/色/质差异</text></g>
</svg>