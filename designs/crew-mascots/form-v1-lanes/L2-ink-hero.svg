<text x="22" y="404" font-size="7.2" fill="#AAA">↓ 预览仅示意 · 真实 64px / 圆形 / 顶栏验证见独立场景文件（grid64 / circle / bar32）</text>
<rect x="12" y="418" width="1000" height="48" rx="12" fill="#FAFAF8" stroke="#E8E0D8" stroke-width="1"/>
<text x="22" y="436" font-size="8.2" fill="#888" font-weight="700">形/线/色/质/构成一致选择 · #E85D26</text>
<text x="22" y="453" font-size="7.5" fill="#8A7E74">五角色同车道共享同一描边、同一质感与同一用色逻辑；物种仅靠顶部轮廓（圆耳/长耳/角羽/尖耳/刺背）与受控角色色区分，未改变 A 头身结构。</text>
<rect x="12" y="552" width="1000" height="78" rx="12" fill="#F5F5F3" stroke="#111" stroke-width="1"/>
<text x="18" y="572" font-size="10.5" fill="#111"><tspan font-weight="800">主张：</tspan><tspan fill="#222">以深墨大色块统一五角色，用象牙负形挖出五官，仅一处橙点作身份微标记。</tspan></text>
<text x="18" y="590" font-size="10" fill="#2B2B2B"><tspan font-weight="700" fill="#111">适配：</tspan>深墨+象牙的高对比与 WeMediaBuddy 黑底 W 同频，同框不打架且极易做单色反白。</text>
<text x="18" y="608" font-size="10" fill="#6B6B6B"><tspan font-weight="700" fill="#111">风险：</tspan>大色块在纯黑底上融边，需靠象牙负形提亮；橙点过少时角色色区分弱，依赖轮廓而非色彩。</text>
</svg>