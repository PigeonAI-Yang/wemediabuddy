<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 380" role="img">
<title>DA-02 软囊同源变体 — 统一囊体+体型拉伸</title>
<g fill="#000">
  <!-- 桌助：方正软囊 + 居中扁顶（主编桌的镇定） -->
  <g id="desk">
    <rect x="44" y="108" width="170" height="174" rx="48"/>
    <ellipse cx="129" cy="96" rx="44" ry="20"/>
    <rect x="108" y="282" width="42" height="18" rx="8"/>
  </g>
  <!-- 记者：高瘦软囊 + 尖鳍天线 -->
  <g id="reporter">
    <rect x="372" y="54" width="108" height="242" rx="40"/>
    <!-- 尖鳍 -->
    <path d="M 426 54 L 452 18 L 468 54 Z"/>
    <rect x="442" y="18" width="6" height="38" rx="3"/>
    <circle cx="454" cy="12" r="8"/>
    <rect x="392" y="296" width="36" height="16" rx="7"/>
    <rect x="432" y="296" width="36" height="16" rx="7"/>
  </g>
  <!-- 策划：等边圆囊 + 顶部决策钮 -->
  <g id="planner">
    <rect x="612" y="98" width="172" height="172" rx="56"/>
    <circle cx="698" cy="78" r="26"/>
    <rect x="686" y="96" width="24" height="18" rx="4"/>
    <rect x="658" y="270" width="32" height="16" rx="7"/>
    <rect x="708" y="270" width="32" height="16" rx="7"/>
  </g>
  <!-- 写手：窄长囊 + 笔尖收口 -->
  <g id="writer">
    <!-- 主囊 -->
    <rect x="942" y="48" width="80" height="228" rx="28"/>
    <!-- 下收口三角 -->
    <path d="M 942 276 L 1022 276 L 982 310 Z"/>
    <rect x="958" y="300" width="48" height="12" rx="5"/>
  </g>
  <!-- 资料员：宽扁囊 + 双层缝线口 -->
  <g id="archivist">
    <rect x="1110" y="138" width="270" height="132" rx="42"/>
    <!-- 顶部双缝线（凸起保持连体） -->
    <rect x="1132" y="118" width="110" height="24" rx="8"/>
    <rect x="1254" y="118" width="100" height="24" rx="8"/>
    <rect x="1152" y="270" width="40" height="14" rx="6"/>
    <rect x="1288" y="270" width="40" height="14" rx="6"/>
  </g>
</g>
<g font-family="sans-serif" font-size="16" fill="#000" text-anchor="middle" font-weight="600">
  <text x="129" y="358">桌助</text>
  <text x="426" y="358">记者</text>
  <text x="698" y="358">策划</text>
  <text x="982" y="358">写手</text>
  <text x="1245" y="358">资料员</text>
</g>
<g font-family="sans-serif" font-size="11" fill="#888" text-anchor="middle">
  <text x="700" y="18">DA-02 · 同一软囊基形变体 — 统一圆角囊体，仅靠高宽比与单一顶部钩子区分</text>
</g>
</svg>
