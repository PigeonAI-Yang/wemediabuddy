<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 380" role="img">
<title>DA-01 桌上文具拟人 — 五角色纯黑剪影</title>
<!-- 画布 1400x380，剪影区 y=40-310，标签 y=350 外 -->
<g fill="#000">
  <!-- 桌助：台灯（底座+立柱+灯罩） -->
  <g id="desk">
    <rect x="40" y="282" width="180" height="28" rx="10"/>
    <rect x="108" y="150" width="18" height="136" rx="9"/>
    <!-- 灯罩：梯形+圆顶合成一个剪影轮廓 -->
    <path d="M 58 150 L 198 150 L 182 90 L 74 90 Z"/>
    <ellipse cx="128" cy="88" rx="56" ry="28"/>
    <!-- 灯罩下沿小缺口表示铰链（保持连通）-->
    <rect x="100" y="143" width="56" height="14" rx="3"/>
  </g>
  <!-- 记者：潜望镜/天线筒（高筒+顶碟+侧天线） -->
  <g id="reporter">
    <rect x="352" y="286" width="130" height="24" rx="8"/>
    <rect x="376" y="60" width="82" height="230" rx="22"/>
    <!-- 顶碟 -->
    <ellipse cx="417" cy="58" rx="72" ry="22"/>
    <rect x="405" y="28" width="24" height="36" rx="6"/>
    <!-- 侧探针（连体） -->
    <rect x="458" y="96" width="52" height="14" rx="7" transform="rotate(28 458 103)"/>
    <circle cx="514" cy="92" r="13"/>
  </g>
  <!-- 策划：图章（方墩+顶部印钮） -->
  <g id="planner">
    <rect x="612" y="120" width="172" height="168" rx="22"/>
    <rect x="612" y="272" width="172" height="18" rx="4"/>
    <!-- 印钮：阶梯圆 -->
    <rect x="674" y="88" width="48" height="36" rx="6"/>
    <circle cx="698" cy="62" r="36"/>
    <circle cx="698" cy="62" r="14" fill="#fff" opacity="0"/>
    <!-- 印台脚 -->
    <rect x="640" y="294" width="36" height="14" rx="6"/>
    <rect x="720" y="294" width="36" height="14" rx="6"/>
  </g>
  <!-- 写手：钢笔（笔杆+笔夹+笔尖） -->
  <g id="writer">
    <rect x="932" y="288" width="100" height="20" rx="7"/>
    <!-- 笔身 -->
    <rect x="948" y="56" width="68" height="236" rx="20"/>
    <!-- 笔夹 -->
    <rect x="990" y="78" width="38" height="12" rx="6"/>
    <rect x="1012" y="78" width="12" height="58" rx="6"/>
    <!-- 笔尖（三角形连体） -->
    <path d="M 948 292 L 1016 292 L 982 322 Z"/>
  </g>
  <!-- 资料员：档案盒（宽盒+顶部三档标签+底部抽屉线） -->
  <g id="archivist">
    <rect x="1120" y="148" width="250" height="148" rx="16"/>
    <!-- 顶部标签档（连体凸起） -->
    <rect x="1138" y="116" width="62" height="36" rx="6"/>
    <rect x="1212" y="106" width="62" height="46" rx="6"/>
    <rect x="1286" y="120" width="62" height="32" rx="6"/>
    <!-- 底部脚 -->
    <rect x="1160" y="300" width="44" height="12" rx="5"/>
    <rect x="1286" y="300" width="44" height="12" rx="5"/>
    <!-- 正面抽屉拉手（镂空不计入剪影，改为凸起保持纯黑） -->
    <rect x="1218" y="212" width="54" height="16" rx="8" fill="#000"/>
  </g>
</g>
<!-- 标签（剪影区外，评审用，不计入剪影） -->
<g font-family="sans-serif" font-size="16" fill="#000" text-anchor="middle" font-weight="600">
  <text x="128" y="358">桌助</text>
  <text x="417" y="358">记者</text>
  <text x="698" y="358">策划</text>
  <text x="982" y="358">写手</text>
  <text x="1245" y="358">资料员</text>
</g>
<g font-family="sans-serif" font-size="11" fill="#888" text-anchor="middle">
  <text x="700" y="18">DA-01 · 桌上文具拟人 — 每个角色是一件桌上工具（灯/筒/章/笔/盒）</text>
</g>
</svg>
