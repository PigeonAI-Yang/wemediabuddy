<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 640" role="img">
<title>V1 · 多物种动物班组</title>
<style>
  text{font-family: ui-sans,system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
</style>
<rect width="1024" height="640" fill="#FFFFFF" rx="16"/>
<rect x="12" y="12" width="1000" height="52" rx="12" fill="#111"/>
<text x="20" y="33" fill="#fff" font-size="15.5" font-weight="800">V1 · 多物种动物班组</text>
<text x="20" y="50" fill="#BBBBBB" font-size="9.5">物种气质对应职责 · 熊 / 兔 / 鸮 / 猫 / 刺猬</text>
<text x="1004" y="34" fill="#E85D26" font-size="9" font-weight="700" text-anchor="end">同画布 1024×640 · 黑白+统一强调色 #E85D26 · 粗视觉</text>
<rect x="12" y="74" width="1000" height="308" rx="14" fill="#FAFAF8" stroke="#E8E0D8" stroke-width="1"/>
<text x="512" y="94" text-anchor="middle" font-size="8.5" fill="#9A9A9A" letter-spacing="0.3">五角色阵容主视图 — 左→右固定顺序：桌助 / 记者 / 策划 / 写手 / 资料员（同画布同粗糙度）</text>

<g id="lineup">
  <!-- 桌助 Bear -->
  <g transform="translate(62,108)">
    <rect x="10" y="108" width="96" height="18" rx="8" fill="#111"/>
    <rect x="18" y="58" width="80" height="62" rx="22" fill="#111"/>
    <circle cx="58" cy="38" r="36" fill="#111"/>
    <circle cx="34" cy="22" r="12" fill="#111"/><circle cx="82" cy="22" r="12" fill="#111"/>
    <circle cx="34" cy="22" r="5" fill="#E85D26"/><circle cx="82" cy="22" r="5" fill="#E85D26"/>
    <ellipse cx="58" cy="48" rx="10" ry="7" fill="#fff"/><ellipse cx="58" cy="50" rx="3.5" ry="2.2" fill="#111"/>
    <circle cx="46" cy="34" r="6.5" fill="#fff"/><circle cx="70" cy="34" r="6.5" fill="#fff"/><circle cx="46" cy="34" r="3.5" fill="#111"/><circle cx="70" cy="34" r="3.5" fill="#111"/>
    <circle cx="46" cy="36" r="1.2" fill="#E85D26"/><circle cx="70" cy="36" r="1.2" fill="#E85D26"/>
    <!-- clipboard -->
    <rect x="72" y="98" width="36" height="28" rx="4" fill="#fff" stroke="#E85D26" stroke-width="2.2"/>
    <rect x="82" y="94" width="16" height="8" rx="2" fill="#E85D26"/>
    <rect x="18" y="102" width="26" height="14" rx="7" fill="#111"/><rect x="72" y="102" width="26" height="14" rx="7" fill="#111"/>
  </g>
  <!-- 记者 Rabbit -->
  <g transform="translate(228,108)">
    <rect x="14" y="128" width="92" height="16" rx="8" fill="#111"/>
    <!-- ears -->
    <ellipse cx="40" cy="8" rx="16" ry="42" fill="#111"/><ellipse cx="78" cy="8" rx="16" ry="42" fill="#111"/>
    <ellipse cx="40" cy="14" rx="7" ry="22" fill="#E85D26" opacity="0.9"/><ellipse cx="78" cy="14" rx="7" ry="22" fill="#E85D26" opacity="0.9"/>
    <circle cx="59" cy="58" r="34" fill="#111"/>
    <ellipse cx="59" cy="78" rx="38" ry="44" fill="#111"/>
    <circle cx="48" cy="54" r="6.5" fill="#fff"/><circle cx="70" cy="54" r="6.5" fill="#fff"/><circle cx="48" cy="54" r="3.5" fill="#111"/><circle cx="70" cy="54" r="3.5" fill="#111"/>
    <ellipse cx="59" cy="68" rx="4" ry="3" fill="#fff"/>
    <!-- camera -->
    <rect x="68" y="96" width="44" height="28" rx="6" fill="#fff" stroke="#111" stroke-width="2.2"/>
    <circle cx="90" cy="110" r="10" fill="#111"/><circle cx="90" cy="110" r="5" fill="#E85D26"/>
    <rect x="20" y="102" width="24" height="12" rx="6" fill="#111"/>
  </g>
  <!-- 策划 Owl -->
  <g transform="translate(400,108)">
    <rect x="10" y="128" width="96" height="16" rx="8" fill="#111"/>
    <ellipse cx="58" cy="78" rx="52" ry="52" fill="#111"/>
    <!-- ear tufts -->
    <path d="M20 34 L28 10 L44 28 Z" fill="#111"/><path d="M72 28 L88 10 L96 34 Z" fill="#111"/>
    <ellipse cx="58" cy="62" rx="36" ry="28" fill="#fff"/>
    <circle cx="42" cy="62" r="12" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="74" cy="62" r="12" fill="#fff" stroke="#111" stroke-width="2"/>
    <circle cx="42" cy="62" r="6" fill="#111"/><circle cx="74" cy="62" r="6" fill="#111"/><circle cx="42" cy="64" r="1.6" fill="#E85D26"/><circle cx="74" cy="64" r="1.6" fill="#E85D26"/>
    <path d="M58 70 L52 78 L64 78 Z" fill="#E85D26"/>
    <!-- stamp prop -->
    <rect x="66" y="100" width="32" height="26" rx="4" fill="#E85D26"/><rect x="70" y="96" width="24" height="8" rx="2" fill="#111"/>
    <circle cx="36" cy="54" r="2" fill="#fff" opacity="0.9"/>
  </g>
  <!-- 写手 Cat -->
  <g transform="translate(576,108)">
    <rect x="16" y="124" width="88" height="16" rx="8" fill="#111"/>
    <rect x="24" y="66" width="72" height="66" rx="22" fill="#111"/>
    <path d="M28 48 L36 14 L56 36 Z" fill="#111"/><path d="M64 36 L84 14 L92 48 Z" fill="#111"/>
    <path d="M34 30 L38 20 L46 30 Z" fill="#E85D26"/><path d="M74 30 L82 20 L86 30 Z" fill="#E85D26"/>
    <circle cx="60" cy="52" r="30" fill="#111"/>
    <circle cx="48" cy="50" r="6" fill="#fff"/><circle cx="72" cy="50" r="6" fill="#fff"/><circle cx="48" cy="50" r="3.2" fill="#111"/><circle cx="72" cy="50" r="3.2" fill="#111"/>
    <path d="M60 58 L56 64 L64 64 Z" fill="#fff"/>
    <path d="M52 66 Q60 72 68 66" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <!-- pen -->
    <rect x="78" y="82" width="10" height="52" rx="5" fill="#E85D26" transform="rotate(-18 83 108)"/>
    <path d="M84 134 L78 144 L88 142 Z" fill="#111"/>
    <!-- tail -->
    <path d="M92 96 Q106 92 102 74" stroke="#111" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
  <!-- 资料员 Hedgehog -->
  <g transform="translate(752,108)">
    <rect x="14" y="126" width="92" height="14" rx="7" fill="#111"/>
    <!-- spines -->
    <path d="M10 80 Q58 -4 106 80 Q82 94 58 88 Q34 94 10 80 Z" fill="#111"/>
    <path d="M22 44 L30 18 L38 42 M44 36 L52 14 L60 34 M68 34 L76 14 L84 36 M86 42 L94 22 L102 46" stroke="#E85D26" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <ellipse cx="60" cy="84" rx="42" ry="38" fill="#111"/>
    <circle cx="60" cy="72" r="28" fill="#FAFAF8" stroke="#111" stroke-width="1.2"/>
    <circle cx="50" cy="68" r="5.5" fill="#fff" stroke="#111" stroke-width="1.2"/><circle cx="70" cy="68" r="5.5" fill="#fff" stroke="#111" stroke-width="1.2"/>
    <circle cx="50" cy="68" r="2.8" fill="#111"/><circle cx="70" cy="68" r="2.8" fill="#111"/>
    <ellipse cx="60" cy="80" rx="5" ry="3.5" fill="#111"/>
    <!-- archive box -->
    <rect x="68" y="98" width="36" height="26" rx="4" fill="#fff" stroke="#111" stroke-width="1.8"/>
    <rect x="68" y="106" width="36" height="4" fill="#E85D26"/>
    <rect x="68" y="114" width="36" height="4" fill="#111" opacity="0.15"/>
  </g>
  <!-- role labels -->
  <g font-size="10" font-weight="700" fill="#222" text-anchor="middle">
    <text x="120" y="276">桌助 · 熊</text><text x="286" y="276">记者 · 兔</text><text x="458" y="276">策划 · 鸮</text><text x="634" y="276">写手 · 猫</text><text x="812" y="276">资料员 · 刺猬</text>
  </g>
  <g font-size="7.5" fill="#888" text-anchor="middle">
    <text x="120" y="288">稳 / 托盘</text><text x="286" y="288">快 / 长耳雷达</text><text x="458" y="288">判 / 眼镜图章</text><text x="634" y="288">磨 / 钢笔尾巴</text><text x="812" y="288">藏 / 刺背档案</text>
  </g>
</g>
<rect x="12" y="390" width="1000" height="84" rx="12" fill="#FFFFFF" stroke="#E8E0D8" stroke-width="1"/>
<text x="22" y="408" font-size="8.5" fill="#888" font-weight="700">64px 圆形头像混排预览（智能体页 5 并排 · 圆形裁切）</text>

<g id="avatars">
  <g transform="translate(84,418)"><circle cx="32" cy="32" r="28" fill="#111"/><circle cx="32" cy="28" r="16" fill="#111"/><circle cx="20" cy="20" r="6" fill="#111"/><circle cx="44" cy="20" r="6" fill="#111"/><circle cx="20" cy="20" r="2.2" fill="#E85D26"/><circle cx="44" cy="20" r="2.2" fill="#E85D26"/><circle cx="26" cy="26" r="3" fill="#fff"/><circle cx="38" cy="26" r="3" fill="#fff"/></g>
  <g transform="translate(212,418)"><circle cx="32" cy="32" r="28" fill="#111"/><ellipse cx="24" cy="12" rx="7" ry="16" fill="#111"/><ellipse cx="40" cy="12" rx="7" ry="16" fill="#111"/><ellipse cx="24" cy="14" rx="2.5" ry="7" fill="#E85D26"/><ellipse cx="40" cy="14" rx="2.5" ry="7" fill="#E85D26"/><circle cx="26" cy="28" r="2.8" fill="#fff"/><circle cx="38" cy="28" r="2.8" fill="#fff"/></g>
  <g transform="translate(340,418)"><circle cx="32" cy="32" r="28" fill="#111"/><circle cx="22" cy="27" r="7" fill="#fff" stroke="#E85D26" stroke-width="1"/><circle cx="42" cy="27" r="7" fill="#fff" stroke="#E85D26" stroke-width="1"/><circle cx="22" cy="27" r="3" fill="#111"/><circle cx="42" cy="27" r="3" fill="#111"/></g>
  <g transform="translate(468,418)"><circle cx="32" cy="32" r="28" fill="#111"/><path d="M18 18 L22 8 L28 16 Z" fill="#111"/><path d="M36 16 L42 8 L46 18 Z" fill="#111"/><circle cx="26" cy="28" r="2.6" fill="#fff"/><circle cx="38" cy="28" r="2.6" fill="#fff"/></g>
  <g transform="translate(596,418)"><circle cx="32" cy="32" r="28" fill="#111"/><path d="M12 30 Q32 6 52 30" fill="none" stroke="#E85D26" stroke-width="1.5"/><circle cx="24" cy="26" r="2.6" fill="#fff"/><circle cx="40" cy="26" r="2.6" fill="#fff"/></g>
  <text x="740" y="442" font-size="9" fill="#999">64px 圆头像 · 黑底白眼+强调色点睛，远观靠轮廓区分</text>
  <text x="740" y="456" font-size="8" fill="#B0A9A0">熊圆耳 / 兔长耳 / 鸮眼镜 / 猫尖耳 / 刺猬刺背</text>
</g>
<rect x="12" y="482" width="1000" height="62" rx="12" fill="#FAFAF8" stroke="#E8E0D8" stroke-width="1"/>
<text x="22" y="500" font-size="8.5" fill="#888" font-weight="700">32px 顶栏缩略预览（今日页值班摘要 · 32px 圆头像 + 文字）</text>

<g id="topbar">
  <rect x="22" y="512" width="980" height="36" rx="10" fill="#fff" stroke="#DDD6CF"/>
  <g font-size="8" fill="#999" text-anchor="middle">
    <g transform="translate(44,518)"><circle cx="14" cy="14" r="14" fill="#111"/><circle cx="10" cy="13" r="1.8" fill="#fff"/><circle cx="18" cy="13" r="1.8" fill="#fff"/></g>
    <text x="76" y="530" font-size="9" fill="#222" font-weight="700">今日值班</text>
    <text x="132" y="530" font-size="8" fill="#888">5 角色 32px 混排</text>
    <g transform="translate(214,520)"><circle cx="12" cy="12" r="12" fill="#111"/><circle cx="12" cy="10" r="3" fill="#fff"/></g>
    <g transform="translate(244,520)"><circle cx="12" cy="12" r="12" fill="#111"/><ellipse cx="12" cy="6" rx="3" ry="6" fill="#E85D26"/></g>
    <g transform="translate(274,520)"><circle cx="12" cy="12" r="12" fill="#111"/><circle cx="12" cy="11" r="5" fill="none" stroke="#fff" stroke-width="1"/></g>
    <g transform="translate(304,520)"><circle cx="12" cy="12" r="12" fill="#111"/><path d="M8 8 L11 4 L14 8 Z" fill="#E85D26"/></g>
    <g transform="translate(334,520)"><circle cx="12" cy="12" r="12" fill="#111"/><path d="M6 10 Q12 4 18 10" stroke="#E85D26" stroke-width="1.2" fill="none"/></g>
    <text x="382" y="530" font-size="8" fill="#666">桌助 熊</text><text x="436" y="530" font-size="8" fill="#666">记者 兔</text><text x="488" y="530" font-size="8" fill="#666">策划 鸮</text><text x="540" y="530" font-size="8" fill="#666">写手 猫</text><text x="596" y="530" font-size="8" fill="#666">资料员 刺猬</text>
    <rect x="650" y="520" width="68" height="18" rx="9" fill="#111"/><text x="684" y="531" text-anchor="middle" font-size="7.5" fill="#fff" font-weight="700">去批选题</text>
  </g>
</g>
<rect x="12" y="552" width="1000" height="78" rx="12" fill="#FFF7F0" stroke="#E85D26" stroke-width="1.05"/>
<text x="18" y="572" font-size="11" fill="#111"><tspan font-weight="800">一句话：</tspan><tspan fill="#222">五种动物各当一岗，用物种本能讲清分工。</tspan></text>
<text x="18" y="592" font-size="10.5" fill="#2B2B2B"><tspan font-weight="700" fill="#111">适配：</tspan>动物直觉易记，智能体页扫一眼就能对上岗，亲切感天然。</text>
<text x="18" y="612" font-size="10.5" fill="#6B6B6B"><tspan font-weight="700" fill="#111">风险：</tspan>物种风格易散，需强统一画法兜住家族感。</text>
</svg>