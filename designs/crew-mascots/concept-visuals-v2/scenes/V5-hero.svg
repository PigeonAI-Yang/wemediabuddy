<rect x="12" y="552" width="1000" height="78" rx="12" fill="#FFF7F0" stroke="#E85D26" stroke-width="1.05"/>
<text x="18" y="572" font-size="11" fill="#111"><tspan font-weight="800">一句话：</tspan><tspan fill="#222">工具自己站起来干活，把“桌上现场”变成一家人。</tspan></text>
<text x="18" y="592" font-size="10.5" fill="#2B2B2B"><tspan font-weight="700" fill="#111">适配：</tspan>与主标黑底 W 同台最协，物件即隐喻，桌感最浓。</text>
<text x="18" y="612" font-size="10.5" fill="#6B6B6B"><tspan font-weight="700" fill="#111">风险：</tspan>物件拟人易过度可爱化，需控表情别滑向文具玩具。</text>
