    <rect x="30" y="60" width="60" height="52" rx="14" fill="#111"/>
    <circle cx="60" cy="38" r="18" fill="#111"/><circle cx="52" cy="38" r="4" fill="#fff"/><circle cx="68" cy="38" r="4" fill="#fff"/><circle cx="52" cy="38" r="1.8" fill="#111"/><circle cx="68" cy="38" r="1.8" fill="#111"/>
    <path d="M82 72 Q98 84 88 102" stroke="#111" stroke-width="10" fill="none" stroke-linecap="round"/>
    <rect x="84" y="96" width="10" height="28" rx="5" fill="#E85D26" transform="rotate(-12 89 110)"/>
    <path d="M90 126 L86 134 L94 132 Z" fill="#111"/>
