<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="12 74 1000 308" width="1000" height="308">
<title>V4 · 数字机器人班组</title>
<style>
  text{font-family: ui-sans,system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
</style>
<rect width="1024" height="640" fill="#FFFFFF" rx="16"/>
<rect x="12" y="12" width="1000" height="52" rx="12" fill="#111"/>
<text x="20" y="33" fill="#fff" font-size="15.5" font-weight="800">V4 · 数字机器人班组</text>
<text x="20" y="50" fill="#BBBBBB" font-size="9.5">五个桌面 AI 机器人 · 以机体功能与状态模块区分</text>
<text x="1004" y="34" fill="#E85D26" font-size="9" font-weight="700" text-anchor="end">同画布 1024×640 · 黑白+统一强调色 #E85D26 · 粗视觉</text>
<rect x="12" y="74" width="1000" height="308" rx="14" fill="#FAFAF8" stroke="#E8E0D8" stroke-width="1"/>
<text x="512" y="94" text-anchor="middle" font-size="8.5" fill="#9A9A9A" letter-spacing="0.3">五角色阵容主视图 — 左→右固定顺序：桌助 / 记者 / 策划 / 写手 / 资料员（同画布同粗糙度）</text>

<g id="lineup">
  <!-- 桌助 console bot -->
  <g transform="translate(62,108)">
    <rect x="20" y="106" width="80" height="18" rx="9" fill="#111"/>
    <rect x="18" y="52" width="84" height="58" rx="16" fill="#111"/>
    <rect x="30" y="62" width="60" height="28" rx="6" fill="#fff"/><rect x="36" y="68" width="18" height="4" rx="1" fill="#E85D26"/><rect x="36" y="74" width="28" height="3" rx="1" fill="#111" opacity="0.3"/>
    <circle cx="50" cy="38" r="22" fill="#111" stroke="#E85D26" stroke-width="2"/><circle cx="50" cy="38" r="8" fill="#fff"/><circle cx="50" cy="38" r="3.5" fill="#111"/><circle cx="50" cy="38" r="1.2" fill="#E85D26"/>
    <circle cx="34" cy="42" r="4" fill="#E85D26"/><circle cx="84" cy="42" r="4" fill="#E85D26"/>
  </g>
  <!-- 记者 drone -->
  <g transform="translate(230,108)">
    <ellipse cx="58" cy="124" rx="28" ry="8" fill="#111" opacity="0.15"/>
    <rect x="30" y="56" width="56" height="42" rx="12" fill="#111"/>
    <ellipse cx="58" cy="36" rx="28" ry="16" fill="#111"/><circle cx="58" cy="36" r="10" fill="#fff"/><circle cx="58" cy="36" r="5" fill="#111"/><circle cx="58" cy="36" r="1.6" fill="#E85D26"/>
    <rect x="12" y="66" width="18" height="8" rx="4" fill="#111"/><rect x="86" y="66" width="18" height="8" rx="4" fill="#111"/>
    <rect x="18" y="72" width="14" height="14" rx="7" fill="#E85D26"/><rect x="84" y="72" width="14" height="14" rx="7" fill="#E85D26"/>
    <circle cx="46" cy="74" r="3.5" fill="#fff"/><circle cx="70" cy="74" r="3.5" fill="#fff"/>
  </g>
  <!-- 策划 analyst bot with halo / chart -->
  <g transform="translate(398,108)">
    <rect x="22" y="108" width="76" height="14" rx="7" fill="#111"/>
    <rect x="24" y="58" width="72" height="52" rx="14" fill="#111"/>
