    <rect x="18" y="60" width="84" height="58" rx="12" fill="#111"/>
    <rect x="26" y="70" width="68" height="10" rx="3" fill="#fff"/><rect x="26" y="84" width="68" height="10" rx="3" fill="#fff"/><rect x="26" y="98" width="68" height="10" rx="3" fill="#fff"/>
    <rect x="30" y="72" width="20" height="6" rx="1" fill="#E85D26"/><rect x="30" y="86" width="30" height="6" rx="1" fill="#E85D26"/><rect x="30" y="100" width="24" height="6" rx="1" fill="#E85D26"/>
    <circle cx="60" cy="34" r="16" fill="#111"/><circle cx="52" cy="34" r="4" fill="#fff"/><circle cx="68" cy="34" r="4" fill="#fff"/>
    <circle cx="30" cy="126" r="5" fill="#fff" stroke="#111" stroke-width="1"/><circle cx="90" cy="126" r="5" fill="#fff" stroke="#111" stroke-width="1"/>
