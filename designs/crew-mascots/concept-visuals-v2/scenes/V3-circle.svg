<rect x="12" y="552" width="1000" height="78" rx="12" fill="#FFF7F0" stroke="#E85D26" stroke-width="1.05"/>
<text x="18" y="572" font-size="11" fill="#111"><tspan font-weight="800">一句话：</tspan><tspan fill="#222">真人小队演“编辑部”，用岗位动作讲分工。</tspan></text>
<text x="18" y="592" font-size="10.5" fill="#2B2B2B"><tspan font-weight="700" fill="#111">适配：</tspan>人形共情最强，策划“判”、写手“磨”的职业感最直接。</text>
<text x="18" y="612" font-size="10.5" fill="#6B6B6B"><tspan font-weight="700" fill="#111">风险：</tspan>五人同为人形，剪影重叠高，需靠道具与姿态硬区分。</text>
