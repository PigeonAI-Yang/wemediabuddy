    <rect x="18" y="128" width="84" height="12" rx="6" fill="#111"/>
  </g>
  <!-- 写手 teardrop + pen tip -->
  <g transform="translate(580,108)">
    <rect x="18" y="44" width="78" height="102" rx="30" fill="#111"/>
    <path d="M40 146 L74 146 L57 168 Z" fill="#111"/>
    <rect x="58" y="62" width="28" height="6" rx="3" fill="#fff" transform="rotate(-22 72 65)"/>
    <rect x="62" y="62" width="6" height="28" rx="3" fill="#E85D26" transform="rotate(-22 65 76)"/>
    <circle cx="48" cy="88" r="5" fill="#fff"/><circle cx="70" cy="88" r="5" fill="#fff"/><circle cx="48" cy="88" r="2.4" fill="#111"/><circle cx="70" cy="88" r="2.4" fill="#111"/>
    <rect x="26" y="128" width="62" height="10" rx="5" fill="#111"/>
  </g>
  <!-- 资料员 flat wide + slots -->
  <g transform="translate(752,108)">
    <rect x="4" y="84" width="112" height="66" rx="18" fill="#111"/>
    <rect x="18" y="54" width="22" height="28" rx="4" fill="#111"/><rect x="48" y="48" width="22" height="34" rx="4" fill="#111"/><rect x="78" y="56" width="22" height="26" rx="4" fill="#111"/>
    <rect x="20" y="58" width="18" height="4" fill="#E85D26"/><rect x="50" y="52" width="18" height="4" fill="#E85D26"/><rect x="80" y="60" width="18" height="4" fill="#E85D26"/>
    <circle cx="42" cy="114" r="5" fill="#fff"/><circle cx="78" cy="114" r="5" fill="#fff"/><circle cx="42" cy="114" r="2.4" fill="#111"/><circle cx="78" cy="114" r="2.4" fill="#111"/>
    <rect x="18" y="132" width="84" height="10" rx="5" fill="#111"/>
  </g>
  <g font-size="10" font-weight="700" fill="#222" text-anchor="middle">
    <text x="120" y="276">桌助 · 方囊</text><text x="286" y="276">记者 · 高囊</text><text x="460" y="276">策划 · 宽囊</text><text x="634" y="276">写手 · 尖囊</text><text x="810" y="276">资料员 · 分格囊</text>
  </g>
  <g font-size="7.5" fill="#888" text-anchor="middle">
    <text x="120" y="288">稳 / 碟形天线</text><text x="286" y="288">快 / 侧探针</text><text x="460" y="288">判 / 印钮</text><text x="634" y="288">磨 / 笔尖</text><text x="810" y="288">藏 / 三档标签</text>
  </g>
</g>
<rect x="12" y="390" width="1000" height="84" rx="12" fill="#FFFFFF" stroke="#E8E0D8" stroke-width="1"/>
<text x="22" y="408" font-size="8.5" fill="#888" font-weight="700">64px 圆形头像混排预览（智能体页 5 并排 · 圆形裁切）</text>

<g id="avatars">
  <g transform="translate(84,418)"><circle cx="32" cy="32" r="28" fill="#111"/><circle cx="32" cy="20" r="9" fill="#E85D26"/><circle cx="24" cy="34" r="2.8" fill="#fff"/><circle cx="40" cy="34" r="2.8" fill="#fff"/></g>
  <g transform="translate(212,418)"><circle cx="32" cy="32" r="28" fill="#111"/><rect x="22" y="10" width="20" height="12" rx="4" fill="#E85D26"/><circle cx="24" cy="34" r="2.6" fill="#fff"/><circle cx="40" cy="34" r="2.6" fill="#fff"/></g>
  <g transform="translate(340,418)"><circle cx="32" cy="32" r="28" fill="#111"/><circle cx="32" cy="18" r="6" fill="#fff"/><circle cx="32" cy="18" r="2.5" fill="#E85D26"/></g>
  <g transform="translate(468,418)"><circle cx="32" cy="32" r="28" fill="#111"/><path d="M32 12 L22 32 L42 32 Z" fill="#E85D26"/></g>
  <g transform="translate(596,418)"><circle cx="32" cy="32" r="28" fill="#111"/><rect x="16" y="14" width="9" height="14" rx="2" fill="#fff"/><rect x="28" y="12" width="9" height="16" rx="2" fill="#fff"/><rect x="40" y="14" width="9" height="14" rx="2" fill="#fff"/></g>
  <text x="740" y="442" font-size="9" fill="#999">同圆囊母形 · 靠顶部钩子区分，家族感纯靠体型</text>
  <text x="740" y="456" font-size="8" fill="#B0A9A0">碟 / 探针 / 印钮 / 尖尾 / 分格</text>
</g>
<rect x="12" y="482" width="1000" height="62" rx="12" fill="#FAFAF8" stroke="#E8E0D8" stroke-width="1"/>
<text x="22" y="500" font-size="8.5" fill="#888" font-weight="700">32px 顶栏缩略预览（今日页值班摘要 · 32px 圆头像 + 文字）</text>

<g id="topbar">
  <rect x="22" y="512" width="980" height="36" rx="10" fill="#fff" stroke="#DDD6CF"/>
  <g font-size="8" fill="#999" text-anchor="middle">
    <g transform="translate(44,518)"><circle cx="14" cy="14" r="14" fill="#111"/><circle cx="14" cy="10" r="4" fill="#E85D26"/></g>
    <text x="78" y="530" font-size="9" fill="#222" font-weight="700">今日值班</text>
    <text x="134" y="530" font-size="8" fill="#888">同族软囊 32px</text>
    <g transform="translate(214,520)"><circle cx="12" cy="12" r="12" fill="#111"/><circle cx="12" cy="8" r="4" fill="#E85D26"/></g>
    <g transform="translate(244,520)"><circle cx="12" cy="12" r="12" fill="#111"/><rect x="8" y="5" width="8" height="6" rx="1" fill="#E85D26"/></g>
    <g transform="translate(274,520)"><circle cx="12" cy="12" r="12" fill="#111"/><circle cx="12" cy="8" r="3" fill="#fff"/></g>
    <g transform="translate(304,520)"><circle cx="12" cy="12" r="12" fill="#111"/><path d="M12 6 L7 16 L17 16 Z" fill="#E85D26"/></g>
    <g transform="translate(334,520)"><circle cx="12" cy="12" r="12" fill="#111"/><rect x="6" y="8" width="4" height="8" rx="1" fill="#fff"/></g>
    <text x="384" y="530" font-size="8" fill="#666">方囊</text><text x="432" y="530" font-size="8" fill="#666">高囊</text><text x="480" y="530" font-size="8" fill="#666">宽囊</text><text x="530" y="530" font-size="8" fill="#666">尖囊</text><text x="580" y="530" font-size="8" fill="#666">分格囊</text>
    <rect x="650" y="520" width="68" height="18" rx="9" fill="#111"/><text x="684" y="531" text-anchor="middle" font-size="7.5" fill="#fff" font-weight="700">去批选题</text>
  </g>
</g>
<rect x="12" y="552" width="1000" height="78" rx="12" fill="#FFF7F0" stroke="#E85D26" stroke-width="1.05"/>
<text x="18" y="572" font-size="11" fill="#111"><tspan font-weight="800">一句话：</tspan><tspan fill="#222">同一软囊家族，用体态与小钩子记住分工。</tspan></text>
<text x="18" y="592" font-size="10.5" fill="#2B2B2B"><tspan font-weight="700" fill="#111">适配：</tspan>家族感最强，五员一看同家，适合强调“同一现场”。</text>
<text x="18" y="612" font-size="10.5" fill="#6B6B6B"><tspan font-weight="700" fill="#111">风险：</tspan>体型差不足易糊，需靠钩子与比例硬拉开区分度。</text>
</svg>