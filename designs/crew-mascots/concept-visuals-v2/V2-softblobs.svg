<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 640" role="img">
<title>V2 · 同族软体生物</title>
<style>
  text{font-family: ui-sans,system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
</style>
<rect width="1024" height="640" fill="#FFFFFF" rx="16"/>
<rect x="12" y="12" width="1000" height="52" rx="12" fill="#111"/>
<text x="20" y="33" fill="#fff" font-size="15.5" font-weight="800">V2 · 同族软体生物</text>
<text x="20" y="50" fill="#BBBBBB" font-size="9.5">共享同一圆囊母形 · 靠体型/姿态/单一钩子区分</text>
<text x="1004" y="34" fill="#E85D26" font-size="9" font-weight="700" text-anchor="end">同画布 1024×640 · 黑白+统一强调色 #E85D26 · 粗视觉</text>
<rect x="12" y="74" width="1000" height="308" rx="14" fill="#FAFAF8" stroke="#E8E0D8" stroke-width="1"/>
<text x="512" y="94" text-anchor="middle" font-size="8.5" fill="#9A9A9A" letter-spacing="0.3">五角色阵容主视图 — 左→右固定顺序：桌助 / 记者 / 策划 / 写手 / 资料员（同画布同粗糙度）</text>

<g id="lineup">
  <!-- 桌助 square blob + antenna dish -->
  <g transform="translate(62,108)">
    <rect x="14" y="64" width="92" height="88" rx="26" fill="#111"/>
    <circle cx="60" cy="46" r="18" fill="#111" stroke="#fff" stroke-width="1.5"/>
    <ellipse cx="60" cy="46" rx="10" ry="5" fill="#E85D26"/>
    <rect x="56" y="28" width="8" height="18" rx="4" fill="#111"/>
    <circle cx="48" cy="96" r="5" fill="#fff"/><circle cx="72" cy="96" r="5" fill="#fff"/><circle cx="48" cy="96" r="2.4" fill="#111"/><circle cx="72" cy="96" r="2.4" fill="#111"/>
    <rect x="20" y="118" width="80" height="10" rx="5" fill="#111"/>
  </g>
  <!-- 记者 tall thin + periscope -->
  <g transform="translate(230,108)">
    <rect x="22" y="28" width="66" height="132" rx="33" fill="#111"/>
    <rect x="38" y="6" width="34" height="32" rx="8" fill="#111"/>
    <ellipse cx="55" cy="12" rx="16" ry="6" fill="#E85D26"/>
    <rect x="68" y="42" width="28" height="8" rx="4" fill="#E85D26" transform="rotate(18 68 46)"/>
    <circle cx="96" cy="36" r="6" fill="#111" stroke="#E85D26" stroke-width="1.2"/>
    <circle cx="42" cy="88" r="5" fill="#fff"/><circle cx="68" cy="88" r="5" fill="#fff"/><circle cx="42" cy="88" r="2.4" fill="#111"/><circle cx="68" cy="88" r="2.4" fill="#111"/>
    <rect x="24" y="134" width="62" height="10" rx="5" fill="#111"/>
  </g>
  <!-- 策划 squat wide + stamp knob -->
  <g transform="translate(398,108)">
    <rect x="6" y="76" width="108" height="74" rx="22" fill="#111"/>
    <rect x="38" y="52" width="44" height="22" rx="6" fill="#111"/>
    <circle cx="60" cy="38" r="16" fill="#fff" stroke="#111" stroke-width="1.5"/><circle cx="60" cy="38" r="5" fill="#E85D26"/>
