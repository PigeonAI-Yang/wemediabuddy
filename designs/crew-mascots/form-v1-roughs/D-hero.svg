<text x="18" y="572" font-size="10.5" fill="#111"><tspan font-weight="800">结构主张：</tspan><tspan fill="#222">以宽底图腾统一重心，用上部收窄形成桌面稳定性。</tspan></text>
<text x="18" y="590" font-size="10" fill="#2B2B2B"><tspan font-weight="700" fill="#111">适配：</tspan>底宽与桌面/任务栏稳重感呼应，多尺寸下底盘不易散。</text>
<text x="18" y="608" font-size="10" fill="#6B6B6B"><tspan font-weight="700" fill="#111">风险：</tspan>底盘偏重，小尺寸下刺猬背刺与底宽叠加需验拥挤度。</text>
