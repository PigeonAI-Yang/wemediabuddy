    <g id="cap">
      <path d="M432 340 Q512 268 592 340 Z" fill="#4A9BD8"/>
      <rect x="420" y="330" width="184" height="28" rx="14" fill="#4A9BD8"/>
    </g>
  </g>
  <g id="face">
