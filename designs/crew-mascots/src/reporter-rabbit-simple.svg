<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#BBDDF5"/>
      <stop offset="1" stop-color="#93C8EE"/>
    </linearGradient>
  </defs>
  <!-- 记者·兔：长耳 + 鸭舌帽，精力过剩 -->
  <g id="accessories">
    <g id="ears">
      <ellipse cx="392" cy="255" rx="58" ry="170" fill="#BBDDF5" transform="rotate(-8 392 255)"/>
      <ellipse cx="632" cy="255" rx="58" ry="170" fill="#BBDDF5" transform="rotate(8 632 255)"/>
      <ellipse cx="392" cy="265" rx="28" ry="110" fill="#FFF9F2" transform="rotate(-8 392 265)"/>
      <ellipse cx="632" cy="265" rx="28" ry="110" fill="#FFF9F2" transform="rotate(8 632 265)"/>
    </g>
  </g>
  <g id="body">
    <ellipse cx="512" cy="580" rx="330" ry="290" fill="url(#fur)"/>
