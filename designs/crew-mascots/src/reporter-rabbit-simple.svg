      <circle cx="395" cy="470" r="40" fill="#3A3238"/>
      <circle cx="408" cy="456" r="13" fill="#FFFFFF"/>
      <circle cx="629" cy="470" r="40" fill="#3A3238"/>
      <circle cx="642" cy="456" r="13" fill="#FFFFFF"/>
    </g>
    <g id="nose">
      <ellipse cx="512" cy="550" rx="28" ry="22" fill="#3A3238"/>
    </g>
    <g id="mouth">
      <path d="M462 582 Q512 646 562 582 Z" fill="#6B3442"/>
      <ellipse cx="512" cy="610" rx="30" ry="16" fill="#E8809A"/>
    </g>
