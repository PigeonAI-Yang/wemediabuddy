<head>

<title>B · 沉浸终审 — WeMediaBuddy 发布工作台</title>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<style>
  /* ============================================================
   * B · 沉浸终审 — page-local layout only.
   * Brand/chrome color: exclusively var(--*) tokens (DS contract).
   * ============================================================ */
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; }
  .wmb-app {
    display: flex; flex-direction: column;
    height: 100vh;
    background: var(--app-bg);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: var(--text-body);
    line-height: var(--text-body-lh);
  }
  button { font-family: inherit; }
  :focus-visible { outline: var(--focus-ring); outline-offset: var(--focus-offset); }

  /* ---------- Topbar ---------- */
  .wmb-topbar {
    flex: none; display: flex; align-items: center; gap: 14px;
    height: var(--topbar-height); padding: 0 var(--page-space);
    border-bottom: 1px solid var(--line);
    background: var(--topbar-bg);
    min-width: 0;
  }
  .wmb-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .wmb-brand-name { font-size: 14px; font-weight: var(--weight-bold); letter-spacing: .01em; white-space: nowrap; }
  .wmb-room {
    display: inline-flex; align-items: center; gap: 7px; min-width: 0;
    padding: 4px 10px; border: 1px solid var(--border-soft); border-radius: var(--radius-pill);
    background: var(--surface); color: var(--ink-soft); font-size: 12.5px; font-weight: var(--weight-demi);
    white-space: nowrap;
  }
  .wmb-room i { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .wmb-topbar-spacer { flex: 1 1 auto; }
  .wmb-topbar-right { display: flex; align-items: center; gap: 8px; flex: none; }
  .wmb-iconbtn {
    display: inline-grid; place-items: center;
    width: 34px; height: 34px;
    border: 1px solid transparent; border-radius: var(--radius-lg);
    background: transparent; color: var(--muted);
    transition: background-color var(--dur-base) var(--ease-base), color var(--dur-base) var(--ease-base), border-color var(--dur-base) var(--ease-base);
  }
  .wmb-iconbtn:hover { background: var(--surface-hover); color: var(--ink); border-color: var(--border-soft); }
  .wmb-iconbtn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .wmb-iconbtn.is-active { color: var(--accent-soft); background: var(--accent-faint); border-color: color-mix(in srgb, var(--accent) 35%, var(--border-soft)); }
  .wmb-link { color: var(--link); font-size: 13px; font-weight: var(--weight-medium); text-decoration: none; white-space: nowrap; }
  .wmb-link:hover { text-decoration: underline; }
  .wmb-topbar-divider { width: 1px; height: 18px; background: var(--line-strong); }

  /* ---------- Shell: strip + canvas ---------- */
  .wmb-shell { flex: 1 1 auto; min-height: 0; display: flex; }

  /* ---------- Board strip (all-platform queue) ---------- */
  .wmb-strip {
    flex: none; width: 340px; min-height: 0;
    display: flex; flex-direction: column;
    border-right: 1px solid var(--line);
    background: var(--panel-bg);
  }
  .wmb-strip__head { flex: none; padding: 14px 16px 10px; }
  .wmb-strip__title { display: flex; align-items: baseline; gap: 8px; font-size: 15px; font-weight: var(--weight-bold); }
  .wmb-strip__count { color: var(--muted-low); font-size: 12px; font-weight: var(--weight-regular); font-variant-numeric: tabular-nums; }
  .wmb-strip__sub { margin-top: 3px; color: var(--muted); font-size: 12px; }
  .wmb-strip__filters { flex: none; display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 12px; }
  .wmb-strip__filters .ds-chip { min-height: var(--control-h-sm); padding: 0 11px; font-size: 12px; }
  .wmb-strip__list {
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    list-style: none; margin: 0; padding: 2px 10px 12px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .wmb-row {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 9px 10px;
    border: 1px solid transparent; border-radius: var(--radius-xl);
    background: transparent; color: inherit; font: inherit; text-align: left;
    cursor: pointer;
    transition: background-color var(--dur-base) var(--ease-base), border-color var(--dur-base) var(--ease-base);
  }
  .wmb-row:hover { background: var(--surface-hover); }
  .wmb-row.is-selected { background: var(--accent-faint); border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
  .wmb-row__mark {
    flex: none; display: grid; place-items: center;
    width: 26px; height: 26px; border-radius: var(--radius-lg);
    background: var(--plat-color, var(--muted-low));
    color: var(--accent-ink); font-size: 11px; font-weight: var(--weight-bold);
  }
  .wmb-row__copy { flex: 1 1 auto; min-width: 0; }
  .wmb-row__title { font-size: 13px; font-weight: var(--weight-semibold); color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wmb-row__meta { display: flex; align-items: center; gap: 6px; margin-top: 3px; color: var(--muted); font-size: 11.5px; min-width: 0; }
  .wmb-row__meta span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wmb-row__ex { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--amber); }
  .wmb-row__pill { flex: none; }
  .wmb-strip__foot {
    flex: none; padding: 10px 16px;
    border-top: 1px solid var(--line);
    color: var(--muted-low); font-size: 11.5px; line-height: 1.55;
  }

  /* ---------- Canvas ---------- */
  .wmb-canvas { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--workspace-bg); }

  /* Overview (no selection) */
  .wmb-overview { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 28px 32px 40px; }
  .wmb-ov-eyebrow { color: var(--accent-soft); font-size: 13px; font-weight: var(--weight-demi); }
  .wmb-ov-title { margin: 8px 0 6px; font-size: var(--text-display); line-height: var(--text-display-lh); letter-spacing: var(--text-display-ls); }
  .wmb-ov-lede { max-width: 68ch; margin: 0; color: var(--muted); font-size: 14.5px; line-height: 1.6; }
  .wmb-ov-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 10px; margin-top: 22px; }
  .wmb-stat {
    display: grid; gap: 5px; padding: 14px 16px;
    border: 1px solid var(--border-soft); border-radius: var(--radius-2xl);
    background: var(--surface); color: inherit; font: inherit; text-align: left; cursor: pointer;
    transition: border-color var(--dur-base) var(--ease-base), background var(--dur-base) var(--ease-base);
  }
  .wmb-stat:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); background: var(--surface-hover); }
  .wmb-stat strong { font-size: 22px; font-weight: var(--weight-bold); font-variant-numeric: tabular-nums; }
  .wmb-stat span { color: var(--muted); font-size: 12.5px; }
  .wmb-ov-guide { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 26px; }
  .wmb-guide {
    padding: 16px; border: 1px solid var(--border-soft); border-radius: var(--radius-2xl);
    background: var(--panel-bg);
  }
  .wmb-guide b { display: block; margin-bottom: 6px; font-size: 13.5px; font-weight: var(--weight-semibold); }
  .wmb-guide b em { font-style: normal; color: var(--accent-soft); font-family: var(--mono); font-size: 12px; margin-right: 6px; }
  .wmb-guide p { margin: 0; color: var(--muted); font-size: 12.5px; line-height: 1.55; }

  /* Review workspace */
  .wmb-review { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .wmb-review__head {
    flex: none; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 20px; border-bottom: 1px solid var(--line);
    background: var(--panel-bg);
  }
  .wmb-review__title { font-size: 16px; font-weight: var(--weight-bold); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wmb-review__meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .wmb-plat {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: var(--radius-pill);
    background: var(--tag-bg); color: var(--ink-soft);
    font-size: 11.5px; font-weight: var(--weight-demi); white-space: nowrap;
  }
  .wmb-plat i { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--plat-color, var(--muted-low)); }
  .wmb-review__time { color: var(--muted); font-size: 12px; white-space: nowrap; font-family: var(--mono); }
  .wmb-review__actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .wmb-rail-toggle { display: none; }
  .wmb-review__tabs { flex: none; padding: 0 20px; background: var(--panel-bg); }
  .wmb-review__tabs .ds-tablist { margin-bottom: 0; border-bottom: 0; }
  .wmb-review__body { flex: 1 1 auto; min-height: 0; display: flex; }
  .wmb-review__main { flex: 1 1 auto; min-width: 0; overflow-y: auto; padding: 20px; }

  /* Rail — calm contextual column */
  .wmb-review__rail {
    flex: none; width: 280px; min-height: 0; overflow-y: auto;
    border-left: 1px solid var(--line); background: var(--panel-bg);
    padding: 14px; display: flex; flex-direction: column; gap: 16px;
  }
  .wmb-rail-sec { display: grid; gap: 8px; }
  .wmb-rail-sec__head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .wmb-rail-sec__head strong { font-size: 12px; font-weight: var(--weight-semibold); color: var(--muted); letter-spacing: .4px; }
  .wmb-rail-sec__head span { color: var(--muted-low); font-size: 11px; }
  .wmb-facts { display: grid; gap: 5px; margin: 0; }
  .wmb-facts div { display: grid; grid-template-columns: 64px 1fr; gap: 4px 10px; font-size: 12.5px; }
  .wmb-facts dt { color: var(--muted); }
  .wmb-facts dd { margin: 0; color: var(--ink-soft); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wmb-grade { display: inline-grid; place-items: center; min-width: 22px; height: 20px; padding: 0 6px; border-radius: var(--radius-sm); font-size: 11px; font-weight: var(--weight-bold); }

  /* Exception card — calm, contextual */
  .wmb-ex { display: grid; gap: 6px; padding: 10px 12px; border-radius: var(--radius-xl); }
  .wmb-ex--auth, .wmb-ex--captcha { background: var(--amber-soft); border: 1px solid color-mix(in srgb, var(--amber) 30%, var(--border-soft)); }
  .wmb-ex--asset { background: var(--danger-soft); border: 1px solid color-mix(in srgb, var(--danger) 30%, var(--border-soft)); }
  .wmb-ex__title { font-size: 12.5px; font-weight: var(--weight-semibold); color: var(--ink); }
  .wmb-ex--auth .wmb-ex__title, .wmb-ex--captcha .wmb-ex__title { color: var(--amber); }
  .wmb-ex--asset .wmb-ex__title { color: var(--danger); }
  .wmb-ex p { margin: 0; color: var(--ink-soft); font-size: 12px; line-height: 1.55; }
  .wmb-ex__hint { color: var(--muted); font-size: 11.5px; }
  .wmb-calm-ok { display: flex; align-items: center; gap: 7px; color: var(--success); font-size: 12.5px; font-weight: var(--weight-medium); }
  .wmb-calm-ok svg { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* Annotation (核对记录) rows */
  .wmb-ann-row { display: grid; gap: 6px; padding: 9px 10px; border: 1px solid var(--border-soft); border-radius: var(--radius-xl); background: var(--surface); }
  .wmb-ann-row.is-selected { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 14%, transparent); }
  .wmb-ann-row.is-done { opacity: .62; }
  .wmb-ann-kinds { display: flex; align-items: center; gap: 6px; }
  .wmb-ann-kind { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: var(--radius-pill); font-size: 11px; font-weight: var(--weight-demi); }
  .wmb-ann-kind svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .wmb-ann-kind--check { color: var(--success); background: var(--success-soft); }
  .wmb-ann-kind--suggest { color: var(--accent-soft); background: var(--accent-faint); }
  .wmb-ann-kind--risk { color: var(--amber); background: var(--amber-soft); }
  .wmb-ann-kind--issue { color: var(--danger); background: var(--danger-soft); }
  .wmb-ann-row p { margin: 0; color: var(--ink-soft); font-size: 12px; line-height: 1.55; }
  .wmb-ann-actions { display: flex; align-items: center; gap: 6px; }
  .wmb-ann-actions .ds-button { min-height: 26px; padding: 0 10px; font-size: 11.5px; border-radius: var(--radius-md); }
  .wmb-ann-state { color: var(--success); font-size: 11.5px; font-weight: var(--weight-demi); }
  .wmb-ann-state.is-muted { color: var(--muted-low); }

  /* Receipt metrics */
  .wmb-receipt { display: grid; gap: 6px; }
  .wmb-receipt div { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; font-size: 12.5px; padding-bottom: 5px; border-bottom: 1px dashed var(--line-strong); }
  .wmb-receipt dt { color: var(--muted); }
  .wmb-receipt dd { margin: 0; color: var(--ink); font-weight: var(--weight-semibold); font-variant-numeric: tabular-nums; }
  .wmb-receipt-ok { display: inline-flex; align-items: center; gap: 5px; color: var(--success); font-size: 11.5px; font-weight: var(--weight-demi); }

  /* ---------- Content proofreading paper ---------- */
  .wmb-paper {
    max-width: 720px; margin: 0 auto;
    padding: 30px 36px 36px;
    border: 1px solid var(--border-soft); border-radius: var(--radius-2xl);
    background: var(--surface);
  }
  .wmb-paper__title { margin: 0 0 6px; font-size: 20px; font-weight: var(--weight-bold); line-height: 1.35; letter-spacing: -.01em; }
  .wmb-paper__meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 18px; color: var(--muted); font-size: 12px; }
  .wmb-paper__meta .wmb-paper__divider { width: 1px; height: 12px; background: var(--line-strong); }
  .wmb-paper__prose { color: var(--ink-soft); font-size: 14.5px; line-height: 1.8; }
  .wmb-paper__prose > * + * { margin-top: 12px; }
  .wmb-paper__prose h2 { margin: 22px 0 8px; font-size: 16px; font-weight: var(--weight-semibold); color: var(--ink); }
  .wmb-paper__prose p { margin: 0; }
  .wmb-paper-quote {
    margin: 0; padding: 12px 16px;
    border-left: 3px solid var(--accent);
    background: var(--accent-faint); border-radius: 0 var(--radius-lg) var(--radius-lg) 0;
    color: var(--ink); font-size: 14.5px; line-height: 1.7;
  }
  .wmb-paper__tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
  .wmb-tag { padding: 2px 10px; border-radius: var(--radius-pill); background: var(--tag-bg); color: var(--muted); font-size: 11.5px; }
  .wmb-paper__hint { margin-top: 16px; color: var(--muted-low); font-size: 11.5px; }

  /* Inline annotation marks */
  .wmb-ann {
    display: inline; margin: 0; padding: 1px 3px;
    border: 0; border-radius: var(--radius-sm);
    border-bottom: 1px dashed transparent;
    color: inherit; font: inherit; cursor: pointer;
    transition: filter var(--dur-base) var(--ease-base);
  }
  .wmb-ann:hover { filter: brightness(1.12); }
  .wmb-ann--check { background: var(--success-soft); color: var(--success); border-bottom-color: color-mix(in srgb, var(--success) 55%, transparent); }
  .wmb-ann--suggest { background: var(--accent-faint); color: var(--accent-soft); border-bottom-color: color-mix(in srgb, var(--accent) 55%, transparent); }
  .wmb-ann--risk { background: var(--amber-soft); color: var(--amber); border-bottom-color: color-mix(in srgb, var(--amber) 55%, transparent); }
  .wmb-ann--issue { background: var(--danger-soft); color: var(--danger); border-bottom-color: color-mix(in srgb, var(--danger) 55%, transparent); }
  .wmb-ann.is-resolved { opacity: .55; text-decoration: line-through; text-decoration-color: color-mix(in srgb, currentColor 60%, transparent); }
  .wmb-ann.is-selected { box-shadow: 0 0 0 2px color-mix(in srgb, currentColor 30%, transparent); }

  /* ---------- Platform preview ---------- */
  .wmb-prevwrap { max-width: 720px; margin: 0 auto; display: grid; gap: 12px; }
  .wmb-prevshell { padding: 12px 14px; border: 1px solid var(--border-soft); border-radius: var(--radius-2xl); background: var(--panel-bg); }
  .wmb-prevshell__bar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; color: var(--muted); font-size: 12px; font-weight: var(--weight-demi); }
  .wmb-prevshell__bar i { width: 8px; height: 8px; border-radius: 50%; background: var(--plat-color, var(--muted-low)); }
  .wmb-prev { border: 1px solid var(--border-soft); border-radius: var(--radius-2xl); background: var(--surface); overflow: hidden; }
  .wmb-prev--wechat .wmb-prev__brand { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .wmb-prev--wechat .wmb-prev__brand span { font-size: 13px; font-weight: var(--weight-bold); color: var(--pf-wx); }
  .wmb-prev--wechat .wmb-prev__body { padding: 18px 20px; }
  .wmb-prev--wechat .wmb-prev__title { margin: 0 0 8px; font-size: 17px; font-weight: var(--weight-bold); line-height: 1.4; }
  .wmb-prev--wechat .wmb-prev__meta { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  .wmb-prev--wechat .wmb-prev__body p { margin: 0 0 10px; color: var(--ink-soft); font-size: 13.5px; line-height: 1.75; }
  .wmb-prev--wechat .wmb-prev__foot { display: flex; gap: 14px; padding: 10px 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  .wmb-prev--xhs { display: grid; grid-template-columns: 132px 1fr; }
  .wmb-prev--xhs .wmb-prev__cover { aspect-ratio: 3/4; display: grid; place-items: center; color: var(--accent-ink); font-size: 12px; font-weight: var(--weight-bold); }
  .wmb-prev--xhs .wmb-prev__cap { padding: 14px 16px; display: grid; gap: 8px; align-content: start; }
  .wmb-prev--xhs .wmb-prev__title { font-size: 13.5px; font-weight: var(--weight-bold); line-height: 1.5; }
  .wmb-prev--xhs .wmb-prev__cap p { margin: 0; color: var(--ink-soft); font-size: 12.5px; line-height: 1.7; }
  .wmb-prev--xhs .wmb-prev__tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .wmb-prev--xhs .wmb-prev__tags i { color: var(--pf-xhs); font-style: normal; font-size: 12px; }
  .wmb-prev--xhs .wmb-prev__acts { display: flex; gap: 12px; padding-top: 8px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  .wmb-prev--zhihu .wmb-prev__q { padding: 14px 16px; background: color-mix(in srgb, var(--info) 8%, var(--surface)); border-bottom: 1px solid var(--line); }
  .wmb-prev--zhihu .wmb-prev__q span { color: var(--muted); font-size: 12px; }
  .wmb-prev--zhihu .wmb-prev__q p { margin: 4px 0 0; font-size: 15px; font-weight: var(--weight-bold); }
  .wmb-prev--zhihu .wmb-prev__a { padding: 14px 16px; }
  .wmb-prev--zhihu .wmb-prev__who { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .wmb-prev--zhihu .wmb-prev__avatar { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: color-mix(in srgb, var(--info) 22%, var(--surface-raised)); color: var(--info); font-size: 12px; font-weight: var(--weight-bold); }

/* 工具函数                                                           */
/* ------------------------------------------------------------------ */
function splitPara(para, annotations) {
  const marks = annotations
    .filter((a) => a.paraId === para.id && a.status !== 'dismissed')
    .map((a) => ({ a, at: para.text.indexOf(a.match) }))
    .filter((x) => x.at >= 0)
    .sort((x, y) => x.at - y.at);
  const parts = [];
  let cursor = 0;
  for (const { a, at } of marks) {
    if (at < cursor) continue;
    if (at > cursor) parts.push({ text: para.text.slice(cursor, at) });
    parts.push({ text: para.text.slice(at, at + a.match.length), ann: a });
    cursor = at + a.match.length;
  }
  if (cursor < para.text.length) parts.push({ text: para.text.slice(cursor) });
  return parts;
}

function deepCopyRecords() {
  return RECORDS.map((r) => ({
    ...r,
    paragraphs: r.paragraphs.map((p) => ({ ...p })),
    annotations: r.annotations.map((a) => ({ ...a })),
    assets: r.assets.map((x) => ({ ...x })),
    exception: r.exception ? { ...r.exception } : null,
    receipt: r.receipt ? r.receipt.map((x) => ({ ...x })) : null,
  }));
}

  React.useEffect(() => {

              </div>
              <div className="wmb-prev__a">
                <div className="wmb-prev__who"><span className="wmb-prev__avatar">W</span><span>WeMediaBuddy</span></div>
                {p0 && <p>{p0.text}</p>}
                <span className="wmb-prev__more">阅读全文 ›</span>
              </div>
            </div>
          )}
          {rec.platform === 'x' && (
            <div className="wmb-prev wmb-prev--x">
              <div className="wmb-prev__tweet">
                <div className="wmb-prev__who">
                  <span className="wmb-prev__avatar">W</span>
                  <span><b>WeMediaBuddy</b> <span>@WeMediaBuddy · 08-14 21:15</span></span>
                </div>
                <p>{p0 ? p0.text : ''} {p1 ? p1.text : ''}</p>
                <div className="wmb-prev__linkcard">
                  <span>x.com/WeMediaBuddy/status/1937…</span>
                  <em>查看原推文</em>
                </div>
                <div className="wmb-prev__stats"><span>12.4k 曝光</span><span>318 互动</span><span>46 链接点击</span></div>
              </div>
            </div>
          )}
        </div>
        <p className="wmb-prev-note">预览为静态示意，实际渲染以平台为准；发布前仍会做一次真实平台检查。</p>
      </div>
    );
  };

  const renderAssets = (rec) => (
    <div className="wmb-assets">
      {rec.assets.map((asset) => {
        const bad = !asset.ok;
        const grad = `linear-gradient(150deg, color-mix(in srgb, ${PLATFORM_META[rec.platform].color} ${bad ? '62%' : '34%'}, var(--surface-raised)), color-mix(in srgb, ${PLATFORM_META[rec.platform].color} 12%, var(--surface-raised)))`;
        return (
          <div key={asset.id} className={'wmb-asset ' + (bad ? 'is-bad' : '')}>
            <div className="wmb-asset__thumb" style={{ background: grad }}>{asset.glyph}
              {bad ? <span className="wmb-asset__badge">超限</span> : <span className="wmb-asset__badge is-ok">✓ 达标</span>}
            </div>
            <div className="wmb-asset__info">
              <span className="wmb-asset__name">{asset.name}</span>
              <span className="wmb-asset__meta">{asset.meta}</span>
              <span className={'wmb-asset__check ' + (bad ? 'is-bad' : 'is-ok')}>
                {bad ? <IcAlert /> : <IcCheck />}
                {bad ? '超出平台规格' : '符合平台规格'}
              </span>
            </div>
          </div>
        );
      })}
    </div>
  );

  const renderRail = (rec) => {
    const anns = rec.annotations;
    const openCount = anns.filter((a) => a.status === 'open').length;
    return (
      <React.Fragment>
        <section className="wmb-rail-sec">
          <div className="wmb-rail-sec__head"><strong>版本与账号</strong></div>
          <dl className="wmb-facts">
            <div><dt>版本</dt><dd>{rec.version}{rec.retry ? ' · 修复后' : ''}</dd></div>
            <div><dt>账号</dt><dd>{rec.account}</dd></div>
            <div><dt>计划</dt><dd>{rec.planTime}</dd></div>
            <div><dt>优先级</dt><dd><span className={'wmb-grade ds-grade'} data-grade={rec.grade}>{rec.grade}</span></dd></div>
          </dl>
        </section>

        <section className="wmb-rail-sec">
          <div className="wmb-rail-sec__head">
            <strong>需要处理</strong>
            {rec.exception ? <span>1 项</span> : null}
          </div>
          {rec.exception ? (
            <div className={'wmb-ex wmb-ex--' + rec.exception.kind}>
              <div className="wmb-ex__title">{rec.exception.title}</div>
              <p>{rec.exception.detail}</p>
              {rec.exception.kind === 'captcha' && <span className="wmb-ex__hint">AI 已停止自动重试，等待主编决定。</span>}
              {rec.exception.kind === 'auth' && <span className="wmb-ex__hint">在底部操作条点击「去授权」。</span>}
              {rec.exception.kind === 'asset' && <span className="wmb-ex__hint">先修复素材，再人工重试发布。</span>}
            </div>
          ) : (
            <span className="wmb-calm-ok"><IcCheck />无异常，内容已就绪</span>
          )}
        </section>

        <section className="wmb-rail-sec">
          <div className="wmb-rail-sec__head">
            <strong>核对记录</strong>
            <span>{openCount > 0 ? openCount + ' 项待处理' : '已全部处理'}</span>
          </div>
          {anns.map((ann) => {
            const meta = ANN_META[ann.kind];
            const done = ann.status !== 'open';
            return (
              <div key={ann.id} className={'wmb-ann-row' + (selectedAnnId === ann.id ? ' is-selected' : '') + (done ? ' is-done' : '')}>
                <div className="wmb-ann-kinds">
                  <span className={'wmb-ann-kind ' + meta.cls}>
                    {ann.kind === 'check' ? <IcCheck /> : ann.kind === 'suggest' ? <IcBubble /> : <IcAlert />}
                    {meta.label}
                  </span>
                  {done && <span className={'wmb-ann-state' + (ann.status === 'dismissed' ? ' is-muted' : '')}>{ann.status === 'accepted' ? '已采纳' : ann.status === 'fixed' ? '已修复' : '已忽略'}</span>}
                </div>
                <p>{ann.note}</p>
                {!done && (
                  <div className="wmb-ann-actions">
                    <Button size="sm" variant="secondary" onClick={() => applyAnnotation(rec.id, ann.id)}>采纳</Button>
                    <Button size="sm" variant="text" onClick={() => dismissAnnotation(rec.id, ann.id)}>忽略</Button>
                  </div>
                )}
                {done && ann.status !== 'fixed' && (
                  <div className="wmb-ann-actions">
                    <Button size="sm" variant="text" onClick={() => restoreAnnotation(rec.id, ann.id)}>撤销</Button>
                  </div>
                )}
              </div>
            );
          })}
        </section>

        {(rec.receipt || rec.state === 'published' || (rec.state === 'reconcile' && fetchingReceipt)) && (
          <section className="wmb-rail-sec">
            <div className="wmb-rail-sec__head"><strong>回执数据</strong></div>
            {rec.receipt ? (
              <React.Fragment>
                <dl className="wmb-receipt">
                  {rec.receipt.map((item) => (
                    <div key={item.label}><dt>{item.label}</dt><dd>{item.value}</dd></div>
                  ))}
                </dl>
                {rec.reconciled && <span className="wmb-receipt-ok"><IcCheck />已入账 · 对账完成</span>}
              </React.Fragment>
            ) : (
              <p style={{ margin: 0, color: 'var(--muted)', fontSize: '12px' }}>
                {fetchingReceipt ? '正在拉取平台回执…' : '已发布，等待平台回执同步。'}
              </p>
            )}
          </section>
        )}
      </React.Fragment>
    );
  };

  const renderReview = (rec) => {
    const plat = PLATFORM_META[rec.platform];
    const stateMeta = STATE_META[rec.state];
    const publishing = publishRun && publishRun.recordId === rec.id;

    let barHint = null;
    let hintTone = '';
    let primaryLabel = '';
    let secondaryLabel = '';
    let secondaryAction = null;
    let primaryAction = null;
    const primarySlot = (label, onClick, opts) => (
      <span data-testid="primary-action"><Button variant="primary" onClick={onClick} disabled={opts && opts.disabled}>{label}</Button></span>
    );

    if (rec.state === 'pending-auth') {
      barHint = '等待账号授权，授权后进入待人工发布';
      hintTone = 'is-warn';
      primaryLabel = '去授权';
      primaryAction = primarySlot(primaryLabel, () => openModal('authorize', rec.id));
      secondaryLabel = '稍后处理';
      secondaryAction = () => deselectRecord();
    } else if (rec.state === 'pending-publish') {
      barHint = rec.retry ? '素材已修复，等待主编重试发布' : 'AI 已就绪，等待主编确认发布';
      hintTone = 'is-ok';
      primaryLabel = rec.retry ? '重试发布' : '确认发布';
      primaryAction = publishing
        ? primarySlot('发布中…', null, { disabled: true })
        : primarySlot(primaryLabel, () => openModal('publish', rec.id));
      secondaryLabel = '编辑草稿';
      secondaryAction = () => { setModeId('content'); pushToast('已切换到内容终审，可在线编辑'); };
    } else if (rec.state === 'needs-takeover') {
      barHint = 'AI 已停止自动重试，等待主编接管';
      hintTone = 'is-bad';
      primaryLabel = '接管处理';
      primaryAction = primarySlot(primaryLabel, () => openModal('takeover', rec.id));
      secondaryLabel = '我已了解';
      secondaryAction = () => pushToast('异常已记录，等待你的决定');
    } else if (rec.state === 'reconcile') {
      barHint = fetchingReceipt ? '正在拉取平台回执…' : (rec.receipt ? '回执已到，确认入账后归档' : '等待平台回执对账');
      hintTone = rec.receipt ? 'is-ok' : '';
      if (rec.receipt) {
        primaryLabel = '完成对账';
        primaryAction = primarySlot(primaryLabel, completeReconcile);
      } else {
        primaryLabel = '开始对账';
        primaryAction = primarySlot(primaryLabel, startReconcileFetch, { disabled: fetchingReceipt });
      }
      secondaryLabel = '重新拉取';
      secondaryAction = startReconcileFetch;
    } else if (rec.state === 'failed') {
      barHint = '封面素材超限，需先修复';
      hintTone = 'is-bad';
      primaryLabel = '修复素材';
      primaryAction = primarySlot(primaryLabel, fixAssets, { disabled: fixingAssets });
      secondaryLabel = '查看失败日志';
      secondaryAction = () => openModal('log', rec.id);
    } else if (rec.state === 'published') {
      barHint = rec.receipt ? '回执已同步，可随时查看' : '已发布，等待回执同步';
      hintTone = 'is-ok';
      primaryLabel = '查看回执';
      primaryAction = primarySlot(primaryLabel, () => openModal('receipt', rec.id));
      secondaryLabel = '复制链接';
      secondaryAction = () => pushToast('发布链接已复制');
    }

    return (
      <div className="wmb-review">
        <header className="wmb-review__head">
          <Button variant="text" size="sm" onClick={deselectRecord}><IcArrow /> 返回队列</Button>
          <h2 className="wmb-review__title">{rec.title}</h2>
          <div className="wmb-review__meta">
            <span className="wmb-plat" style={{ '--plat-color': plat.color }}><i />{plat.label}</span>
            <span className={'wmb-grade ds-grade'} data-grade={rec.grade}>{rec.grade}</span>
            <StatusPill tone={stateMeta.tone} live={rec.state === 'publishing'}>{stateMeta.label}</StatusPill>
            <span className="wmb-review__time">{rec.planTime}</span>
          </div>
          <div className="wmb-review__actions">
            <button type="button" className="wmb-iconbtn wmb-rail-toggle" data-testid="rail-toggle" aria-label="打开核对与异常面板" aria-pressed={railOpen} onClick={() => setRailOpen((v) => !v)}>
              <IcPanel />
            </button>
          </div>
        </header>

        <div className="wmb-review__tabs">
          <TabList tabs={MODES} selectedId={modeId} onSelect={setModeId} ariaLabel="终审模式" />
        </div>

        <div className="wmb-review__body">
          <div className="wmb-review__main">
            {modeId === 'content' && renderPaper(rec)}
            {modeId === 'preview' && renderPreview(rec)}
            {modeId === 'assets' && renderAssets(rec)}
          </div>
          <aside className={'wmb-review__rail' + (railOpen ? ' is-open' : '')} data-testid="rail">
            {renderRail(rec)}
          </aside>
        </div>

        <footer className="wmb-review__bar">
          <div className="wmb-bar-facts">
            <b>{rec.account}</b>
            <span>{plat.label} · {rec.version}{rec.retry ? ' · 修复后' : ''} · {rec.planTime}</span>
          </div>
          <div className="wmb-bar-center">
            {publishing ? (
              <div className="wmb-steps" role="status">
                {PUB_STEPS.map((stepLabel, idx) => (
                  <span key={stepLabel} className={'wmb-step' + (idx < publishRun.step ? ' is-done' : idx === publishRun.step ? ' is-now' : '')}>
                    {idx < publishRun.step ? <IcCheck /> : idx === publishRun.step ? <IcDot /> : <IcCircle />}
                    {stepLabel}
                  </span>
                ))}
                <WmbCreatureMark state="working" />
              </div>
            ) : (
              <p className={'wmb-bar-hint ' + hintTone}>{barHint}</p>
            )}
          </div>
          <div className="wmb-bar-actions">
            {secondaryLabel && secondaryAction && (
              <Button variant="secondary" onClick={secondaryAction} disabled={fetchingReceipt && secondaryLabel === '重新拉取'}>{secondaryLabel}</Button>
            )}
            {primaryAction}
          </div>
        </footer>
      </div>
    );
  };

  const renderModal = () => {
    if (!modal) return null;
    const rec = records.find((r) => r.id === modal.recordId);
    if (!rec) return null;
    const plat = PLATFORM_META[rec.platform];

    if (modal.kind === 'publish') {
      const retry = rec.retry;
      return (
        <AppModal open title={retry ? '确认重试发布' : '确认发布'} size="confirm" onRequestClose={closeModal} ariaDescription="手动发布确认"
          footer={(
            <React.Fragment>
              <Button variant="secondary" onClick={closeModal}>取消</Button>
              <span data-testid="primary-action"><Button variant="primary" onClick={runPublish}>{retry ? '确认重试' : '确认发布'}</Button></span>
            </React.Fragment>
          )}>
          <p>即将发布：<strong>{rec.title}</strong></p>
          <p>发布目标：{plat.label} · {rec.account}（{rec.version}）</p>
          <p className="wmb-modal-note">AI 只准备内容，不代替主编发布。点击确认后由本机发布助手上传，最终结果以平台回执为准。</p>
        </AppModal>
      );
    }

    if (modal.kind === 'authorize') {
      return (
        <AppModal open title="小红书账号授权" size="standard" onRequestClose={closeModal} ariaDescription="平台账号授权"
          footer={authPhase === 'done' ? (
            <span data-testid="primary-action"><Button variant="primary" onClick={completeAuth}>完成</Button></span>
          ) : (
            <React.Fragment>
              <Button variant="secondary" onClick={closeModal} disabled={authPhase === 'working'}>取消</Button>
              <span data-testid="primary-action"><Button variant="primary" onClick={startAuthFlow} disabled={authPhase === 'working'}>
                {authPhase === 'working' ? '授权中…' : '开始授权'}
              </Button></span>
            </React.Fragment>
          )}>
          <div className="wmb-account-card">
            <i>红</i>
            <span><b>小红书 @灵感小助手</b><span>授权状态：未授权</span></span>
          </div>
          <div className="wmb-perm"><span>发布笔记</span><span>上传图片</span><span>读取回执</span></div>
          {authPhase === 'working' && (
            <div className="wmb-auth-line"><WmbCreatureMark state="working" /> 正在拉起授权页，请稍候…</div>
          )}
          {authPhase === 'done' && (
            <div className="wmb-auth-ok"><IcCheck />授权成功 · 权限已开通</div>
          )}
        </AppModal>
      );
    }

    if (modal.kind === 'takeover') {
      return (
        <AppModal open title="接管发布任务" size="standard" role="alertdialog" onRequestClose={closeModal} ariaDescription="接管异常发布任务"
          footer={(
            <React.Fragment>
              <Button variant="text" onClick={closeModal}>取消</Button>
              <Button variant="secondary" onClick={takeoverDefer}>暂缓稍后重试</Button>
              <span data-testid="primary-action"><Button variant="primary" onClick={takeoverManual}>我已手动发布</Button></span>
            </React.Fragment>
          )}>
          <p><strong>{rec.exception ? rec.exception.title : '发布异常'}</strong></p>
          <p>{rec.exception ? rec.exception.detail : ''}</p>
          <p className="wmb-modal-note">AI 已停止自动重试，以下操作由你决定：手动发布后进入对账，或暂缓到稍后重试。</p>
        </AppModal>
      );
    }

    if (modal.kind === 'receipt') {
      return (
        <AppModal open title="发布回执" size="standard" onRequestClose={closeModal} ariaDescription="发布回执详情"
          footer={(
            <React.Fragment>
              <Button variant="secondary" onClick={() => pushToast('发布链接已复制')}>复制链接</Button>
              <span data-testid="primary-action"><Button variant="primary" onClick={closeModal}>知道了</Button></span>
            </React.Fragment>
          )}>
          {rec.receipt ? (
            <div className="wmb-receipt-grid">
              {rec.receipt.map((item) => (
                <div key={item.label} className="wmb-receipt-cell"><b>{item.value}</b><span>{item.label}</span></div>
              ))}
            </div>
          ) : (
            <p>回执尚未同步，稍后会自动拉取。</p>
          )}
          <p style={{ color: 'var(--muted)', fontSize: '12.5px' }}>{plat.label} · {rec.account} · {rec.planTime}</p>
        </AppModal>
      );
    }

    if (modal.kind === 'log') {
      return (
        <AppModal open title="失败日志" size="standard" onRequestClose={closeModal} ariaDescription="发布失败日志"
          footer={(
            <span data-testid="primary-action"><Button variant="primary" onClick={closeModal}>关闭</Button></span>
          )}>
          <pre className="wmb-log">
            <span>[12:00:03] 发布助手启动：小红书 @灵感小助手</span>{'\n'}
            <span>[12:00:07] 上传 cover-cursor.png 失败：文件 6.4MB 超过平台单图上限 3MB</span>{'\n'}
            <span className="err">[12:00:07] 发布中止，等待素材修复</span>{'\n'}
            <span>[12:00:08] AI 未自动重试（手动发布边界）</span>
          </pre>
        </AppModal>
      );
    }
    return null;
  };

  /* ------------------------------------------------------------------ */
  /* 渲染                                                               */
  /* ------------------------------------------------------------------ */
  const total = records.length;
  const pendingCount = records.filter((r) => ['pending-auth', 'pending-publish', 'needs-takeover'].includes(r.state)).length;

  return (
    <div className="wmb-app">
      <header className="wmb-topbar">
        <div className="wmb-brand">
          <WmbCreatureMark state="working" />
          <span className="wmb-brand-name">WeMediaBuddy</span>
          <span className="wmb-room"><i />B · 沉浸终审</span>
        </div>
        <div className="wmb-topbar-spacer" />
        <div className="wmb-topbar-right">
          <a className="wmb-link" href="index.html">比较方案</a>
          <span className="wmb-topbar-divider" />
          <button
            type="button"
            className={'wmb-iconbtn' + (piOpen ? ' is-active' : '')}
            data-testid="pi-toggle"
            aria-label={piOpen ? '收起 Pi 助理' : '展开 Pi 助理'}
            aria-expanded={piOpen}
            onClick={() => setPiOpen((v) => !v)}
          >
            <IcBubble />
          </button>
          <button
            type="button"
            className="wmb-iconbtn"
            data-testid="theme-toggle"
            aria-label={theme === 'dark' ? '切换到白昼主题' : '切换到墨夜主题'}
            onClick={() => applyTheme(theme === 'dark' ? 'light' : 'dark')}
          >
            {theme === 'dark' ? <IcSun /> : <IcMoon />}
          </button>
        </div>
      </header>

      <div className="wmb-shell">
        <aside className="wmb-strip">
          <div className="wmb-strip__head">
            <div className="wmb-strip__title">发布队列<span className="wmb-strip__count">{total} 条 · {pendingCount} 条待处理</span></div>
            <div className="wmb-strip__sub">跨平台任务一览，点选进入终审</div>
          </div>
          <div className="wmb-strip__filters">
            {FILTERS.map((f) => (
              <ChipFilter
                key={f.id}
                label={f.label}
                count={f.id === 'all' ? total : countBy(f.id)}
                pressed={filterId === f.id}
                onToggle={(nextPressed) => setFilterId(nextPressed ? f.id : 'all')}
              />
            ))}
          </div>
          {filteredRecords.length ? (
            <ul className="wmb-strip__list" data-testid="task-list">
              {filteredRecords.map((rec) => {
                const plat = PLATFORM_META[rec.platform];
                const stateMeta = STATE_META[rec.state];
                return (
                  <li key={rec.id}>
                    <button
                      type="button"
                      className={'wmb-row' + (selectedId === rec.id ? ' is-selected' : '')}
                      data-testid="task-row"
                      data-state={rec.state}
                      aria-pressed={selectedId === rec.id}
                      onClick={() => (selectedId === rec.id ? deselectRecord() : selectRecord(rec.id))}
                    >
                      <span className="wmb-row__mark" style={{ '--plat-color': plat.color }}>{plat.short}</span>
                      <span className="wmb-row__copy">
                        <span className="wmb-row__title">{rec.title}</span>
                        <span className="wmb-row__meta">
                          {rec.exception && <i className="wmb-row__ex" title={rec.exception.title} />}
                          <span>{plat.label} · {rec.planTime}</span>
                        </span>
                      </span>
                      <span className="wmb-row__pill">
                        <StatusPill tone={stateMeta.tone} live={rec.state === 'publishing'}>{stateMeta.label}</StatusPill>
                      </span>
                    </button>
                  </li>
                );
              })}
            </ul>
          ) : (
            <div className="wmb-strip__list">
              <StatePanel state="empty" title="该状态下没有记录" body="切换筛选或回到「全部」。" />
            </div>
          )}
          <div className="wmb-strip__foot">边界：AI 只准备内容与回执，最终发布一律由主编手动确认。</div>
        </aside>

        <main className="wmb-canvas" data-testid="detail">
          {currentRecord ? renderReview(currentRecord) : renderOverview()}
        </main>
      </div>

      <aside className={'wmb-pi' + (piOpen ? ' is-open' : '')} data-testid="pi-panel" aria-label="Pi 主编助理" aria-hidden={!piOpen}>
        <div className="ds-pi-head">
          <WmbCreatureMark state={piOpen ? 'working' : 'idle'} />
          <span className="ds-pi-title">Pi · 主编助理</span>
        </div>
        <p className="ds-pi-context"><em>当前记录</em><span>{currentRecord ? currentRecord.title : '未选择'}</span></p>
        <div className="ds-pi-transcript">
          {piTranscript.map((msg, idx) => (
            <div key={idx} className={'ds-pi-msg ' + (msg.from === 'user' ? 'ds-pi-msg--user' : 'ds-pi-msg--agent')}>
              {msg.text}
            </div>
          ))}
        </div>
        <div className="ds-pi-composer">
          <textarea
            value={piText}
            onChange={(evt) => setPiText(evt.target.value)}
            placeholder="向 Pi 提问，例如：这篇的风险点是什么？"
            aria-label="向 Pi 提问"
          />
          <div className="ds-pi-composer-bar">
            <span className="ds-pi-composer-meta"><button type="button" className="ds-pi-model-trigger">模型 · 默认</button></span>
            <button type="button" className="ds-pi-send" aria-label="发送" onClick={sendPi} disabled={!piText.trim()}>
              <svg viewBox="0 0 24 24"><path d="M4 11.5L20 4l-7.5 16-2.2-6.3L4 11.5z" /><path d="M10.3 13.7L20 4" /></svg>
            </button>
          </div>
        </div>
      </aside>

      <div className="wmb-toasts" role="status" aria-live="polite">
        {toasts.map((t) => <div key={t.id} className="wmb-toast">{t.text}</div>)}
      </div>

      {renderModal()}
    </div>
  );
}

const rootEl = document.getElementById('root');
ReactDOM.createRoot(rootEl).render(<App />);
}
</script>
</body>
</html>
