WMB-5265 · Baoyu corrective redesign
Assumptions: Owner is a chief editor scanning many content-platform tasks, then entering one task to verify account/version/media before manual final publication.
Context: Existing WMB shell, foundation tokens, and the bound WeMediaBuddy Design System remain authoritative.
Decision: Keep the content × platform matrix, but remove stacked chrome, tiny pills, duplicated counts, and empty dashboard framing. One compact room header, one work queue statement, one readable matrix.

<body><div id="root"></div>
<script type="text/babel">
const { AppModal, Button, WmbCreatureMark } = window.WemediaBuddyDesignSystem_1c877c;
const NAV_ITEMS = [
  ['今日','calendar'],['智能体','people'],['发现','compass'],['选题','note'],['创作','pen'],['发布','send'],['结果','chart'],['主题','nodes'],['资料库','folder'],['关系画布','share']
];
const PLATFORM_DATA = [
  {id:'x',name:'X',account:'@PigeonYang',mark:'X',tone:'x'},
  {id:'xiaohongshu',name:'小红书',account:'PigeonYang',mark:'小',tone:'red'},
  {id:'wechat',name:'公众号',account:'雾灯财经',mark:'微',tone:'green'},
  {id:'zhihu',name:'知乎',account:'PigeonYang',mark:'知',tone:''}
];
const STATE_DATA = {
  authorize:{action:'去登录',meta:'还没有登录',tone:'warn'},
  manual:{action:'打开并发布',meta:'内容已准备好',tone:'warn'},
  takeover:{action:'打开页面',meta:'需要你完成验证',tone:'warn'},
  reconcile:{action:'看看结果',meta:'还没确认是否发布',tone:'info'},
  failed:{action:'再试一次',meta:'上次没有发出',tone:'bad'},
  published:{action:'查看内容',meta:'今天 09:42 已发布',tone:'ok'}
};
const INITIAL_ROWS = [
  {id:'karpathy',title:'Karpathy：真正限制 Agent 的不是模型，而是上下文工程',cells:{x:'authorize',xiaohongshu:'manual',wechat:'published',zhihu:'reconcile'}},
  {id:'openai',title:'GPT-5.4 发布后，内容团队最该重做的三个工作习惯',cells:{x:'published',xiaohongshu:'failed',wechat:'manual',zhihu:null}},
  {id:'uk-ai',title:'英国 AI 创业者正在重新计算算力成本',cells:{x:'takeover',xiaohongshu:null,wechat:'authorize',zhihu:'published'}},
  {id:'memory',title:'为什么“更长的记忆”不等于更懂你的 AI',cells:{x:'published',xiaohongshu:'reconcile',wechat:null,zhihu:'manual'}}
];
function NavGlyph({kind}){const paths={calendar:'M5 3v3M19 3v3M4 8h16M5 5h14a1 1 0 0 1 1 1v14H4V6a1 1 0 0 1 1-1',people:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75',compass:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M16 8l-2 6-6 2 2-6 6-2',note:'M6 3h12v18H6zM9 8h6M9 12h6M9 16h4',pen:'M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z',send:'M22 2 11 13M22 2l-7 20-4-9-9-4z',chart:'M4 19V9M10 19V5M16 19v-7M22 19H2',nodes:'M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6M19 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6M8 22a3 3 0 1 0 0-6 3 3 0 0 0 0 6M10.5 6.5l5 7M10.5 19.5l5-2.5',folder:'M3 5h7l2 2h9v12H3z',share:'M18 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6M6 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6M18 22a3 3 0 1 0 0-6 3 3 0 0 0 0 6M8.6 13.5l6.8-4M8.6 16.5l6.8 4'};return <svg viewBox="0 0 24 24"><path d={paths[kind]}/></svg>}
function App(){
  const [themeMode,setThemeMode]=React.useState('dark');
  const [piOpen,setPiOpen]=React.useState(false);
  const [activeView,setActiveView]=React.useState('board');
  const [rowsData,setRowsData]=React.useState(INITIAL_ROWS);
  const [detailId,setDetailId]=React.useState(null);
  const [selectedTask,setSelectedTask]=React.useState(null);
  const [toastText,setToastText]=React.useState('');
  React.useEffect(()=>{document.documentElement.dataset.theme=themeMode},[themeMode]);
  React.useEffect(()=>{if(!toastText)return;const timer=setTimeout(()=>setToastText(''),1800);return()=>clearTimeout(timer)},[toastText]);
  const visibleRows=React.useMemo(()=>rowsData.filter(row=>activeView==='todo'?Object.values(row.cells).some(value=>value&&value!=='published'):activeView==='history'?Object.values(row.cells).some(value=>value==='published'):true),[rowsData,activeView]);
  const detailRow=rowsData.find(row=>row.id===detailId)||null;
  const selectedRow=selectedTask?rowsData.find(row=>row.id===selectedTask.rowId):null;
  const selectedPlatform=selectedTask?PLATFORM_DATA.find(platform=>platform.id===selectedTask.platformId):null;
  const selectedStateKey=selectedTask&&selectedRow?selectedRow.cells[selectedTask.platformId]:null;
  const selectedState=selectedStateKey?STATE_DATA[selectedStateKey]:null;
  function openTask(rowId,platformId){setSelectedTask({rowId,platformId})}
  function completeTask(){if(!selectedTask||!selectedPlatform||!selectedStateKey)return;const shouldWait=selectedStateKey!=='published'&&selectedStateKey!=='reconcile';if(shouldWait)setRowsData(current=>current.map(row=>row.id===selectedTask.rowId?{...row,cells:{...row.cells,[selectedTask.platformId]:'reconcile'}}:row));setSelectedTask(null);setToastText('已打开 '+selectedPlatform.name)}
  return <div className="app">
    <header className="topbar">
      <div className="brand"><WmbCreatureMark state="idle"/><strong>WeMediaBuddy</strong></div>
      <div className="top-actions">
        <button className="icon" aria-label="切换主题" title="切换主题" onClick={()=>setThemeMode(themeMode==='dark'?'light':'dark')}><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg></button>
        <button className="icon" aria-label={piOpen?'收起 Pi':'展开 Pi'} title={piOpen?'收起 Pi':'展开 Pi'} aria-pressed={piOpen} onClick={()=>setPiOpen(!piOpen)}><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"/></svg></button>
      </div>
    </header>
    <div className="shell">
      <aside className="sidebar"><div className="nav-label">工作流</div><nav className="nav">{NAV_ITEMS.slice(0,7).map(([label,kind])=><button key={label} className={'nav-item '+(label==='发布'?'active':'')}><NavGlyph kind={kind}/><span>{label}</span></button>)}</nav><div className="nav-label">知识资产</div><nav className="nav">{NAV_ITEMS.slice(7).map(([label,kind])=><button key={label} className="nav-item"><NavGlyph kind={kind}/><span>{label}</span></button>)}</nav><div className="nav-bottom"><button className="nav-item"><NavGlyph kind="note"/><span>设置</span></button></div></aside>
      <div className={'work-area '+(piOpen?'pi-open':'')}>
        <main className="workspace">
          {!detailRow?<>
            <section className="room-head">
              <div className="room-copy"><div className="room-titleline"><h1>发布</h1></div><p>选择一篇内容，再选择要发布的平台。</p></div>
              <div className="room-actions"><button className="quiet-action" onClick={()=>setToastText('已刷新')}>刷新</button><Button variant="primary" size="sm" onClick={()=>{const row=rowsData.find(item=>Object.values(item.cells).some(value=>value&&value!=='published'));if(row){const platformId=Object.keys(row.cells).find(key=>row.cells[key]&&row.cells[key]!=='published');openTask(row.id,platformId)}}}>继续发布</Button></div>
            </section>
            <section className="board">
              <div className="board-bar"><div className="view-tabs" role="tablist" aria-label="发布内容">{[['board','全部'],['todo','待我处理'],['history','已发布']].map(([id,label])=><button key={id} role="tab" aria-selected={activeView===id} className={'view-tab '+(activeView===id?'active':'')} onClick={()=>setActiveView(id)}>{label}</button>)}</div></div>
              <div className="matrix-frame"><div className="matrix" role="table" aria-label="内容和发布平台">
                <div className="matrix-head"><div className="corner" role="columnheader"><strong>内容</strong></div>{PLATFORM_DATA.map(platform=><div className="platform-head" role="columnheader" key={platform.id}><span className={'platform-mark '+platform.tone}>{platform.mark}</span><span><strong>{platform.name}</strong><small>{platform.account}</small></span></div>)}</div>
                {visibleRows.map(row=><div className="project-row" role="row" key={row.id}><div className="project-cell" role="rowheader"><button className="project-open" onClick={()=>setDetailId(row.id)}><strong>{row.title}</strong></button></div>{PLATFORM_DATA.map(platform=>{const rawStateKey=row.cells[platform.id];const stateKey=activeView==='todo'&&rawStateKey==='published'||activeView==='history'&&rawStateKey!=='published'?null:rawStateKey;if(!stateKey)return <div key={platform.id} className="task-slot empty" role="cell">—</div>;const state=STATE_DATA[stateKey];return <div className="task-slot" role="cell" key={platform.id}><button className="matrix-cell" onClick={()=>openTask(row.id,platform.id)}><span className="cell-status"><i className={'dot '+state.tone}/>{state.action}<span className="cell-more">›</span></span><span className="cell-meta">{state.meta}</span></button></div>})}</div>)}
              </div></div>
            </section>
          </>:<section className="detail"><button className="detail-back" onClick={()=>setDetailId(null)}>← 返回发布</button><h2>{detailRow.title}</h2><p>选择一个平台继续</p><div className="detail-grid"><div className="detail-section"><h3>发布到</h3><div className="detail-list">{PLATFORM_DATA.map(platform=>{const stateKey=detailRow.cells[platform.id];const state=stateKey?STATE_DATA[stateKey]:null;return <div className="detail-row" key={platform.id}><strong>{platform.name}</strong><small>{platform.account}</small><span>{state?state.meta:'—'}</span>{state?<Button variant="text" size="sm" onClick={()=>openTask(detailRow.id,platform.id)}>{state.action}</Button>:<span/>}</div>})}</div></div><div className="detail-section"><h3>内容</h3><p>标题、正文和图片都已准备好。</p><p>打开平台后，预览无误即可发布。</p></div></div></section>}
        </main>
        <aside className="pi-panel" aria-hidden={!piOpen}><div className="pi-inner"><div className="pi-head"><strong>Pi</strong></div><div className="pi-body">要我帮你检查哪一篇？</div><div className="pi-compose">问问 Pi…</div></div></aside>
      </div>
    </div>
    <AppModal open={Boolean(selectedTask)} title={selectedPlatform&&selectedState?selectedState.action+' · '+selectedPlatform.name:'发布'} size="large" onRequestClose={()=>setSelectedTask(null)} footer={selectedState?<><Button variant="secondary" onClick={()=>setSelectedTask(null)}>取消</Button><Button variant="primary" onClick={completeTask}>{selectedState.action==='查看内容'?'关闭':selectedState.action}</Button></>:null}>
      {selectedRow&&selectedPlatform&&selectedState?<div><h3 style={{margin:'0 0 6px',fontSize:'18px'}}>{selectedRow.title}</h3><p style={{margin:'0 0 16px',color:'var(--muted)'}}>将用 {selectedPlatform.account} 打开 {selectedPlatform.name}。</p><div className="modal-summary"><div className="fact"><span>账号</span><strong>{selectedPlatform.account}</strong></div><div className="fact"><span>准备好的内容</span><strong>{selectedPlatform.id==='xiaohongshu'?'正文和 3 张图片':'正文和封面'}</strong></div></div><div className="confirm-note">打开后请先预览，确认无误再发布。</div></div>:null}
    </AppModal>
    {toastText?<div className="toast" role="status">{toastText}</div>:null}
  </div>
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
