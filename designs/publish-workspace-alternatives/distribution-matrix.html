/* ============================================================
 * C · 分发矩阵 — page-local layout. Brand/chrome colors come
 * ONLY from the WeMediaBuddy DS token list (var(--*)); no
 * one-off hex/rgb/hsl. Distinction via depth/scale/typography.
 * ============================================================ */
html, body, #root { height: 100%; }
body {
  background: var(--app-bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: var(--text-body);
  line-height: var(--text-body-lh);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
.visually-hidden {
  position: absolute; width: 1px; height: 1px; margin: -1px;
  padding: 0; border: 0; clip: rect(0 0 0 0); overflow: hidden; white-space: nowrap;
}

.c-app { height: 100%; display: flex; flex-direction: column; }

/* ---------- slim topbar ---------- */
.c-topbar {
  flex: none; height: var(--topbar-height);
  display: flex; align-items: center; gap: 12px;
  padding: 0 var(--page-space);
  background: var(--topbar-bg);
  border-bottom: 1px solid var(--line-strong);
}
.c-brand { display: flex; align-items: center; gap: 9px; min-width: 0; color: var(--ink); }
.c-brand strong { font-size: 14px; font-weight: var(--weight-bold); letter-spacing: .01em; white-space: nowrap; }
.c-brand small { color: var(--muted); font-size: 12px; white-space: nowrap; }
.c-topbar-divider { flex: none; width: 1px; height: 18px; background: var(--line-strong); }
.c-topbar-title { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-topbar-title em { font-style: normal; color: var(--accent-soft); font-weight: var(--weight-demi); }
.c-back {
  margin-left: auto; flex: none;
  display: inline-flex; align-items: center; gap: 5px;
  height: 30px; padding: 0 11px;
  border: 1px solid var(--border-soft); border-radius: var(--radius-lg);
  color: var(--muted); font-size: 12.5px; text-decoration: none;
}
.c-back:hover { color: var(--ink); background: var(--surface-hover); border-color: var(--border); }
.c-back svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.c-top-actions { display: flex; gap: 6px; flex: none; }
.c-icon-btn {
  width: 32px; height: 32px; display: inline-grid; place-items: center;
  border: 1px solid var(--border-soft); border-radius: var(--radius-lg);
  background: transparent; color: var(--muted); cursor: pointer;
}
.c-icon-btn:hover { color: var(--ink); background: var(--surface-hover); border-color: var(--border); }
.c-icon-btn[aria-pressed="true"] { color: var(--accent-soft); background: var(--accent-faint); border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
.c-icon-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- main grid: board + focus stage ---------- */
.c-main {
  flex: 1 1 auto; min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) clamp(300px, 25vw, 372px);
}
.c-board {
  min-width: 0; min-height: 0;
  display: flex; flex-direction: column; gap: 10px;
  padding: var(--page-space) var(--page-space) var(--page-space) var(--page-space);
}

/* ---------- room heading ---------- */
.c-room-head { flex: none; display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; }
.c-eyebrow { color: var(--accent-soft); font-size: 13px; font-weight: var(--weight-demi); letter-spacing: .05em; }
.c-room-head h1 { margin: 3px 0 3px; font-size: var(--text-display); line-height: var(--text-display-lh); letter-spacing: var(--text-display-ls); color: var(--ink); }
.c-room-head p { margin: 0; max-width: 60ch; color: var(--muted); font-size: 13px; line-height: 1.5; }
.c-head-stats { display: flex; gap: 8px; flex: none; }
.c-stat {
  min-width: 62px; display: grid; gap: 1px;
  padding: 7px 11px;
  border: 1px solid var(--border-soft); border-radius: var(--radius-xl);
  background: var(--surface);
}
.c-stat strong { font-size: 16px; font-weight: var(--weight-bold); color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1.15; }
.c-stat span { font-size: 10.5px; color: var(--muted); }
.c-stat--warn strong { color: var(--amber); }

/* ---------- controls ---------- */
.c-controls { flex: none; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.c-chips { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.c-scan { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: none; }
.c-scan-hint { color: var(--muted-low); font-size: 11px; font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- anomaly strip ---------- */
.c-strip { flex: none; display: flex; align-items: center; gap: 6px; min-height: 32px; overflow: hidden; }
.c-strip-label { flex: none; color: var(--muted-low); font-size: 10.5px; font-weight: var(--weight-semibold); letter-spacing: 1.2px; }
.c-strip-scroll { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.c-anom {
  flex: none; display: inline-flex; align-items: center; gap: 6px;
  height: 26px; padding: 0 10px;
  border: 1px solid var(--border-soft); border-radius: var(--radius-pill);
  background: var(--surface); color: var(--ink-soft); font-size: 12px; cursor: pointer;
}
.c-anom:hover { background: var(--surface-hover); border-color: var(--border); color: var(--ink); }
.c-anom[aria-pressed="true"] { background: var(--amber-soft); border-color: color-mix(in srgb, var(--amber) 55%, var(--border)); color: var(--amber); }
.c-anom .sev { font-family: var(--mono); font-size: 9.5px; font-weight: var(--weight-bold); }
.c-anom .sev[data-sev="高"] { color: var(--danger); }
.c-anom .sev[data-sev="中"] { color: var(--amber); }
.c-anom .sev[data-sev="低"] { color: var(--muted); }
.c-strip-note { flex: none; color: var(--muted-low); font-size: 11px; font-family: var(--mono); white-space: nowrap; }

/* ---------- matrix ---------- */
.c-matrix-scroll { flex: 1 1 auto; min-height: 0; overflow: auto; border: 1px solid var(--border-soft); border-radius: var(--radius-2xl); background: var(--panel-bg); }

.mx th { font-weight: var(--weight-medium); text-align: left; }

.mx tbody tr:last-child td, .mx tbody tr:last-child th { border-bottom: 0; }
.mx tbody tr:hover td { background: color-mix(in srgb, var(--surface-hover) 32%, transparent); }

.mx-corner span { display: block; font-size: 10.5px; color: var(--muted-low); font-weight: var(--weight-semibold); letter-spacing: .8px; }
.mx-corner .mx-corner-sub { margin-top: 2px; color: var(--muted); letter-spacing: 0; font-weight: var(--weight-regular); }
.mx-colname { display: flex; align-items: center; gap: 6px; color: var(--ink); font-size: 12.5px; font-weight: var(--weight-bold); white-space: nowrap; }
.mx-colacct { display: block; margin-top: 2px; color: var(--muted); font-family: var(--mono); font-size: 10px; white-space: nowrap; }
.mx-colstat { display: block; margin-top: 3px; font-family: var(--mono); font-size: 9.5px; color: var(--success); font-variant-numeric: tabular-nums; }
.mx-colstat.has { color: var(--amber); }

.mx-rowtitle { display: block; color: var(--ink-soft); font-size: 12.5px; font-weight: var(--weight-semibold); line-height: 1.35; }
.mx-rowmeta { display: flex; align-items: center; gap: 6px; margin-top: 5px; }
.mx-version { color: var(--muted-low); font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.cell {
  display: flex; flex-direction: column; align-items: flex-start; gap: 5px;
  width: 100%; min-height: 56px; padding: 7px 9px;
  border: 0; background: transparent; text-align: left; cursor: pointer;
}
.cell:hover { background: var(--surface-hover); }
.cell:focus-visible { outline: var(--focus-ring-soft); outline-offset: -2px; }
.cell.is-selected { background: var(--selected); box-shadow: inset 0 0 0 1.5px var(--accent); }
.cell.is-selected:hover { background: var(--selected); }
.cell.is-hl { background: var(--amber-soft); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--amber) 60%, transparent); }
.cell.is-hl.is-selected { box-shadow: inset 0 0 0 1.5px var(--amber); }
.cell.is-dimmed { opacity: .26; pointer-events: none; }
.cell-line1 { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; max-width: 100%; }
.cell-tag {
  flex: none; padding: 1px 5px; border-radius: var(--radius-xs);
  background: var(--amber-soft); color: var(--amber);
  font-family: var(--mono); font-size: 9px; font-weight: var(--weight-bold);
}
.cell-at { font-family: var(--mono); font-size: 10px; color: var(--muted-low); font-variant-numeric: tabular-nums; white-space: nowrap; }
.cell.is-selected .cell-at { color: var(--muted); }
.cell-empty { display: grid; place-items: center; min-height: 56px; color: var(--muted-low); font-size: 12px; }

/* ---------- focus stage (detail) ---------- */
.c-stage { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--panel-bg); border-left: 1px solid var(--line-strong); }
.c-stage-head { flex: none; padding: 13px 16px 11px; border-bottom: 1px solid var(--line); }
.c-stage-platform { display: flex; align-items: center; gap: 7px; min-width: 0; }
.c-pdot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--muted-low); }
.c-pdot[data-tone="xhs"] { background: var(--pf-xhs); }
.c-pdot[data-tone="wx"] { background: var(--pf-wx); }
.c-pdot[data-tone="x"] { background: var(--pf-x); }
.c-stage-platform strong { color: var(--ink); font-size: 13.5px; font-weight: var(--weight-bold); white-space: nowrap; }
.c-stage-platform span { color: var(--muted); font-family: var(--mono); font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.c-stage-pillrow { display: flex; align-items: center; gap: 8px; margin-top: 9px; flex-wrap: wrap; }
.c-stage-at { color: var(--muted-low); font-family: var(--mono); font-size: 10.5px; font-variant-numeric: tabular-nums; }
.c-stage-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 12px 16px 8px; display: flex; flex-direction: column; gap: 15px; }
.c-stage-title h2 { margin: 0 0 4px; font-size: var(--text-title); line-height: var(--text-title-lh); letter-spacing: var(--text-title-ls); color: var(--ink); }

.c-block h3 { margin: 0 0 5px; color: var(--muted-low); font-size: 10.5px; font-weight: var(--weight-semibold); letter-spacing: .9px; }

.c-block p strong { color: var(--ink); font-weight: var(--weight-semibold); }
.c-timeline { display: grid; gap: 4px; }
.c-tl-row { display: grid; grid-template-columns: 76px 1fr; gap: 8px; font-size: 11.5px; line-height: 1.5; }
.c-tl-row time { color: var(--muted-low); font-family: var(--mono); font-size: 10.5px; }
.c-tl-row span { color: var(--ink-soft); }
.c-anom-refs { display: flex; flex-direction: column; gap: 5px; }
.c-anom-ref {

.c-overview { padding: 6px 2px; display: flex; flex-direction: column; gap: 13px; }

/* ---------- toasts ---------- */
.c-toasts { position: fixed; right: 18px; bottom: 18px; z-index: 6000; display: flex; flex-direction: column; gap: 8px; }
.c-toast {

}
.c-toast i { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--success); }
@keyframes c-toast-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- Pi overlay ---------- */
.c-pi {
  position: fixed; top: var(--topbar-height); right: 0; bottom: 0;
  width: var(--pi-width); max-width: calc(100vw - 32px);
  z-index: 2000;
  display: flex; flex-direction: column;
  background: var(--panel-bg); border-left: 1px solid var(--border);
  transform: translateX(105%);
  visibility: hidden;
  transition: transform var(--dur-expand) var(--ease-out-expo), visibility 0s linear var(--dur-expand);
}
.c-pi.is-open { transform: none; visibility: visible; box-shadow: var(--shadow-modal); transition: transform var(--dur-expand) var(--ease-out-expo); }

.c-auth-steps { display: grid; gap: 8px; margin: 0 0 2px; padding: 0; list-style: none; }

.c-metric { padding: 10px 12px; border: 1px solid var(--border-soft); border-radius: var(--radius-xl); background: var(--surface); }
.c-metric strong { display: block; color: var(--ink); font-size: 18px; font-weight: var(--weight-bold); font-variant-numeric: tabular-nums; line-height: 1.2; }
.c-metric span { color: var(--muted); font-size: 11px; }
.c-ratio-line { display: flex; align-items: center; gap: 8px; color: var(--ink-soft); font-size: 12.5px; }
.c-ratio-line strong { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.c-ratio-line .ok { color: var(--success); }
.c-ratio-line .warn { color: var(--amber); }
.c-ratio-line .bad { color: var(--danger); }
.c-recon-steps { display: grid; gap: 7px; }
.c-recon-step { display: flex; align-items: center; gap: 9px; color: var(--ink-soft); font-size: 12.5px; }
.c-recon-dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--muted-low); }
.c-recon-step.done .c-recon-dot { background: var(--success); }
.c-recon-step.done { color: var(--muted); }
.c-recon-step.active .c-recon-dot { background: var(--accent); animation: c-pulse 1s ease-in-out infinite; }
.c-recon-step.active { color: var(--ink); }

.c-preview-excerpt { color: var(--ink-soft); font-size: 13.5px; line-height: 1.7; }
.c-preview-adapt { margin: 12px 0 0; padding: 10px 12px; border: 1px solid var(--border-soft); border-radius: var(--radius-xl); background: var(--surface); color: var(--muted); font-size: 12px; line-height: 1.6; }
.c-preview-adapt strong { color: var(--ink-soft); font-weight: var(--weight-semibold); }

@media (prefers-reduced-motion: reduce) {
  .c-pi, .c-pi.is-open { transition: none; }
  .c-toast { animation: none; }
  .c-recon-step.active .c-recon-dot { animation: none; }
}

function mkLog(cell) {
  const at = cell.at || '—';
  switch (cell.st) {
    case 'auth':      return [[at, '内容生成并通过校对'], ['—', '等待账号授权']];
    case 'manual':    return [[at, '内容与发布清单已就绪'], ['—', '等待人工发布（AI 不代发）']];
    case 'takeover':  return [[at, '发布被平台干预'], ['—', '等待人工接管']];
    case 'reconcile': return [[at, '已发布'], ['—', '等待互动数据回流']];
    case 'failed':    return [[at, '失败 #2 · 401'], ['昨天', '失败 #1 · 网络超时']];
    case 'retrying':  return [['刚刚', '重试已发起'], [at, '失败 #2 · 401']];
    case 'published': return [[at, '已发布'], ['—', '对账完成']];
    default:          return [];
  }
}

function seedMetrics(key) {
  let h = 0;
  for (let idx = 0; idx < key.length; idx++) h = (h * 31 + key.charCodeAt(idx)) % 9973;
  return { read: 120 + (h % 420), like: 8 + (h % 38), comment: h % 9, ratio: (0.55 + ((h >> 3) % 9) / 20) };
}

function keyOf(rowId, platId) { return rowId + ':' + platId; }

/* ---------------- app ---------------- */
function App() {
  const [matrixRows, setMatrixRows] = React.useState(ROWS);
  const [selKey, setSelKey] = React.useState('pub-x-karpathy:x');
  const [activeFilter, setActiveFilter] = React.useState('all');
  const [anomOnly, setAnomOnly] = React.useState(false);
  const [scanning, setScanning] = React.useState(false);
  const [activeAnomaly, setActiveAnomaly] = React.useState(null);
  const [modalState, setModalState] = React.useState(null); /* {kind, key} */
  const [toastList, setToastList] = React.useState([]);
  const [piOpen, setPiOpen] = React.useState(false);
  const [piDraft, setPiDraft] = React.useState('');
  const [piMsgList, setPiMsgList] = React.useState([
    { role: 'agent', text: '矩阵侦察完成：发现 4 处异常，其中 2 处高优先（跨平台不同步、X 发布失败）。' },
    { role: 'agent', text: '建议先处理 pub-x-karpathy × X 的 401 重试，我会盯着结果并同步对账。' },
  ]);
  const [themeMode, setThemeMode] = React.useState('dark');

  const rowMap = {};
  matrixRows.forEach((r) => { rowMap[r.id] = r; });
  const cellOf = (key) => { const [rid, pid] = key.split(':'); return rowMap[rid] ? rowMap[rid].cells[pid] : null; };

  const visibleAnomalies = ANOMALIES.filter((a) => a.live(rowMap));
  const anomKeys = new Set(visibleAnomalies.flatMap((a) => a.cells));
  const resolvedCount = ANOMALIES.length - visibleAnomalies.length;

  React.useEffect(() => {
    document.documentElement.setAttribute('data-theme', themeMode);
  }, [themeMode]);

  /* drop highlight when the linked anomaly resolves (e.g. after a successful retry) */
  React.useEffect(() => {
    if (activeAnomaly && !visibleAnomalies.some((a) => a.id === activeAnomaly)) setActiveAnomaly(null);
    /* eslint-disable-next-line react-hooks/exhaustive-deps */
  }, [visibleAnomalies.length]);

  function pushToast(text) {
    const id = Date.now() + Math.random().toString(36).slice(2);
    setToastList((prev) => [...prev, { id, text }]);
    setTimeout(() => setToastList((prev) => prev.filter((t) => t.id !== id)), 3400);
  }

  function applyCell(key, patch) {
    const [rid, pid] = key.split(':');
    setMatrixRows((prev) => prev.map((r) => (
      r.id === rid ? { ...r, cells: { ...r.cells, [pid]: { ...r.cells[pid], ...patch } } } : r
    )));
  }

  function selectCell(key) {
    const cell = cellOf(key);
    if (!cell || cell.st === null) return;
    if (activeFilter !== 'all' && cell.st !== activeFilter && !(cell.st === 'retrying' && activeFilter === 'failed')) return;
    if (anomOnly && !anomKeys.has(key)) return;
    setSelKey(key);
  }

  function toggleFilter(fk) {
    setActiveFilter(activeFilter === fk ? 'all' : fk);
  }

  function runScan() {
    if (scanning) return;
    const n = visibleAnomalies.length;
    setScanning(true);
    setTimeout(() => {
      setScanning(false);
      pushToast('矩阵侦察完成：' + n + ' 处异常待处理');
    }, 950);
  }

  function toggleAnomaly(aId) {
    if (activeAnomaly === aId) { setActiveAnomaly(null); return; }
    setActiveAnomaly(aId);
    const anom = ANOMALIES.find((a) => a.id === aId);
    if (anom && anom.cells.length > 0) setSelKey(anom.cells[0]);
  }

  function openModal(kind) {
    if (!selKey) return;
    setModalState({ kind, key: selKey });
  }
  function closeModal() { setModalState(null); }

  /* ---- state transitions ---- */
  function confirmAuth() {
    const key = modalState.key;
    const [, pid] = key.split(':');
    const plat = PLATFORMS.find((p) => p.id === pid);
    closeModal();
    applyCell(key, { st: 'manual', at: '待发布' });
    pushToast('授权完成：' + plat.name + ' 已就绪，进入人工发布队列');
  }
  function confirmManual() {
    const key = modalState.key;
    const [rid, pid] = key.split(':');
    const plat = PLATFORMS.find((p) => p.id === pid);
    closeModal();
    applyCell(key, { st: 'published', at: '刚刚', metrics: seedMetrics(key) });
    pushToast('已标记发布：' + rowMap[rid].title + ' × ' + plat.name);
  }
  function confirmTakeover() {
    const key = modalState.key;
    const [rid, pid] = key.split(':');
    const plat = PLATFORMS.find((p) => p.id === pid);
    closeModal();
    applyCell(key, { st: 'reconcile', at: '已发布 0h', note: '重新发布' });
    pushToast('接管完成：' + plat.name + ' 已替换封面并重新发布');
  }
  function confirmRetry() {
    const key = modalState.key;
    const [rid, pid] = key.split(':');
    const plat = PLATFORMS.find((p) => p.id === pid);
    closeModal();
    applyCell(key, { st: 'retrying', at: '重试中' });
    setTimeout(() => {
      applyCell(key, { st: 'published', at: '刚刚', metrics: seedMetrics(key) });
      pushToast('重试成功：' + rowMap[rid].title + ' 已发布到 ' + plat.name);
    }, 1500);
  }
  function finishReconcile(key) {
    const [rid, pid] = key.split(':');
    const plat = PLATFORMS.find((p) => p.id === pid);
    closeModal();
    applyCell(key, { st: 'published', at: '刚刚', metrics: seedMetrics(key) });
    pushToast('对账完成：' + plat.name + ' 3 项指标已回流');
  }

  function sendPi() {
    const text = piDraft.trim();
    if (!text) return;
    setPiDraft('');
    setPiMsgList((prev) => [...prev, { role: 'user', text }]);
    const [rid, pid] = selKey ? selKey.split(':') : [];
    const row = rowMap[rid]; const plat = PLATFORMS.find((p) => p.id === pid);
    const title = row ? row.title.slice(0, 16) + '…' : '全矩阵';
    const label = row && plat && cellOf(selKey) ? (STATE_META[cellOf(selKey).st] || {}).label || '—' : '—';
    setTimeout(() => {
      setPiMsgList((prev) => [...prev, { role: 'agent', text: '收到。我会跟进「' + title + ' × ' + (plat ? plat.name : '') + '」的' + label + '进度，状态变化会同步到矩阵。' }]);
    }, 800);
  }

  /* ---- derived numbers ---- */
  function countState(st) {
    let n = 0;
    matrixRows.forEach((r) => PLATFORMS.forEach((p) => { const c = r.cells[p.id]; if (c && c.st === st) n++; }));
    return n;
  }
  const totalCells = matrixRows.reduce((acc, r) => acc + PLATFORMS.filter((p) => r.cells[p.id] && r.cells[p.id].st !== null).length, 0);

  function pendingCount(pid) {
    let n = 0;
    matrixRows.forEach((r) => { const c = r.cells[pid]; if (c && PENDING_KEYS.includes(c.st)) n++; });
    return n;
  }

  const selRow = selKey ? rowMap[selKey.split(':')[0]] : null;
  const selCell = selKey ? cellOf(selKey) : null;
  const selPlat = selKey ? PLATFORMS.find((p) => p.id === selKey.split(':')[1]) : null;
  const selMeta = selCell && selCell.st ? STATE_META[selCell.st] : null;
  const selAnoms = visibleAnomalies.filter((a) => a.cells.indexOf(selKey) !== -1);

  function cellClasses(key, st) {
    const cls = ['cell'];
    if (selKey === key) cls.push('is-selected');
    if (activeAnomaly && ANOMALIES.find((a) => a.id === activeAnomaly).cells.indexOf(key) !== -1) cls.push('is-hl');
    let dim = false;
    if (activeFilter !== 'all') dim = dim || (st !== activeFilter && !(st === 'retrying' && activeFilter === 'failed'));
    if (anomOnly) dim = dim || !anomKeys.has(key);
    if (dim) cls.push('is-dimmed');
    return cls.join(' ');
  }

  /* ---- modal content ---- */
  const modalKey = modalState ? modalState.key : selKey;
  const modalRow = modalKey ? rowMap[modalKey.split(':')[0]] : null;
  const modalPlat = modalKey ? PLATFORMS.find((p) => p.id === modalKey.split(':')[1]) : null;
  const modalCell = modalKey ? cellOf(modalKey) : null;

  let modalTitle = '操作';
  if (modalState && modalPlat) {
    switch (modalState.kind) {
      case 'auth':      modalTitle = '连接账号 · ' + modalPlat.name; break;
      case 'manual':    modalTitle = '人工发布 · ' + modalPlat.name; break;
      case 'takeover':  modalTitle = '接管处理 · ' + modalPlat.name; break;
      case 'reconcile': modalTitle = '开始对账 · ' + modalPlat.name; break;
      case 'failed':    modalTitle = '重试发布 · ' + modalPlat.name; break;
      case 'published': modalTitle = '数据对账 · ' + modalPlat.name; break;
      case 'preview':   modalTitle = '内容预览 · ' + modalPlat.name; break;
      default: break;
    }
  }

  let modalBody = null;
  let modalFooter = null;
  if (modalState && modalRow && modalCell) {
    if (modalState.kind === 'auth') {
      modalBody = (
        <div>
          <p style={{ margin: '0 0 12px' }}>连接 <strong>{modalPlat.name} · {modalPlat.acct}</strong>，让内容进入该平台的发布队列：</p>
          <ol className="c-auth-steps">
            <li><span className="no">1</span><span>在平台后台打开「开发者 / 创作者」设置</span></li>
            <li><span className="no">2</span><span>完成 OAuth 授权并回填密钥</span></li>
            <li><span className="no">3</span><span>回到矩阵，该格自动变为「待人工发布」</span></li>
          </ol>
        </div>
      );
      modalFooter = (
        <React.Fragment>
          <Button variant="secondary" onClick={closeModal}>取消</Button>
          <Button variant="primary" onClick={confirmAuth}>已完成授权</Button>
        </React.Fragment>
      );
    } else if (modalState.kind === 'manual') {
      modalBody = (
        <div>
          <p style={{ margin: '0 0 10px' }}>「{modalRow.title}」的分发材料与发布清单已就绪。AI 不代发——</p>
          <p style={{ margin: '0' }}>请打开 <strong>{modalPlat.name} · {modalPlat.acct}</strong> 后台，按清单完成手动发布，然后回到这里标记。</p>
          <p className="c-warn-note">此步由你亲自执行：自动发布权限默认关闭，任何智能体都不会代你点击「发布」。</p>
        </div>
      );
      modalFooter = (
        <React.Fragment>
          <Button variant="secondary" onClick={closeModal}>稍后</Button>
          <Button variant="primary" onClick={confirmManual}>我已手动发布</Button>
        </React.Fragment>
      );
    } else if (modalState.kind === 'takeover') {
      modalBody = (
        <div>
          <p style={{ margin: '0 0 10px' }}>平台干预原因：<strong>{modalCell.note || '素材不合规'}</strong>。</p>
          <p style={{ margin: '0' }}>处理方案：替换封面（去掉二维码）→ 重新提交审核 → 发布后回到矩阵对账。</p>
          <p className="c-warn-note">限流期间请勿重复提交；处理完成后该格会进入「待对账」。</p>
        </div>
      );
      modalFooter = (
        <React.Fragment>
          <Button variant="secondary" onClick={closeModal}>取消</Button>
          <Button variant="primary" onClick={confirmTakeover}>替换封面并重发</Button>
        </React.Fragment>
      );
    } else if (modalState.kind === 'failed') {
      modalBody = (
        <div>
          <p style={{ margin: '0 0 10px' }}>失败原因：<strong>{modalCell.note || '未知'}</strong>，已重试 2 次。</p>
          <p style={{ margin: '0' }}>重试会重新连接平台并提交发布；若仍失败，请先检查授权状态。</p>
        </div>
      );
      modalFooter = (
        <React.Fragment>
          <Button variant="secondary" onClick={closeModal}>检查授权</Button>
          <Button variant="primary" onClick={confirmRetry}>重试发布</Button>
        </React.Fragment>
      );
    } else if (modalState.kind === 'reconcile') {
      modalBody = (
        <ReconcileProgress onDone={finishReconcile.bind(null, modalState.key)} />
      );
      modalFooter = null;
    } else if (modalState.kind === 'published') {
      const m = modalCell.metrics || { read: 0, like: 0, comment: 0, ratio: 0.6 };
      const ratioCls = m.ratio >= 0.8 ? 'ok' : (m.ratio >= 0.55 ? 'warn' : 'bad');
      modalBody = (
        <div>
          <div className="c-metrics">
            <div className="c-metric"><strong>{m.read}</strong><span>阅读 / 曝光</span></div>
            <div className="c-metric"><strong>{m.like}</strong><span>点赞 / 互动</span></div>
            <div className="c-metric"><strong>{m.comment}</strong><span>评论</span></div>
          </div>
          <p className="c-ratio-line">相对同频道中位线 <strong className={ratioCls}>{m.ratio.toFixed(1)}×</strong>
            <span style={{ color: 'var(--muted)', fontSize: '12px' }}>（对账完成于对账批次 #238）</span></p>
        </div>
      );
      modalFooter = (
        <React.Fragment>
          <Button variant="secondary" onClick={closeModal}>关闭</Button>
        </React.Fragment>
      );
    } else if (modalState.kind === 'preview') {
      modalBody = (
        <div>
          <p className="c-preview-excerpt">{modalRow.excerpt}</p>
          <p className="c-preview-excerpt" style={{ color: 'var(--muted)' }}>（正文已在内容库完成校对，此处为预览摘要。完整稿见内容库对应记录。）</p>
          <p className="c-preview-adapt"><strong>{modalPlat.name} 适配清单：</strong>{PLATFORM_ADAPT[modalPlat.id]}</p>
        </div>
      );
      modalFooter = (
        <React.Fragment>
          <Button variant="secondary" onClick={closeModal}>关闭</Button>
        </React.Fragment>
      );
    }
  }

  /* ---- render ---- */
  const piContextText = selRow && selPlat ? selRow.title.slice(0, 14) + '… × ' + selPlat.name : '全矩阵';

  return (
    <div className="c-app">
      <header className="c-topbar">
        <div className="c-brand">
          <WmbCreatureMark state={scanning ? 'working' : (piOpen ? 'settling' : 'idle')} />
          <strong>WeMediaBuddy</strong>
          <small>发布工作台</small>
        </div>
        <span className="c-topbar-divider" />
        <span className="c-topbar-title">分发矩阵 <em>· 方案 C</em></span>
        <a className="c-back" href="index.html">
          <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" /></svg>
          比较方案
        </a>
        <div className="c-top-actions">
          <button type="button" className="c-icon-btn" data-testid="theme-toggle"
            aria-pressed={themeMode === 'light'} title="切换主题"
            onClick={() => setThemeMode(themeMode === 'dark' ? 'light' : 'dark')}>
            {themeMode === 'dark'
              ? <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z" /></svg>
              : <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>}
          </button>
          <button type="button" className="c-icon-btn" data-testid="pi-toggle"
            aria-pressed={piOpen} title={piOpen ? '收起 Pi' : '展开 Pi'}
            onClick={() => setPiOpen(!piOpen)}>
            <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z" /></svg>
          </button>
        </div>
      </header>

      <div className="c-main">
        <section className="c-board" aria-label="分发矩阵工作台">
          <div className="c-room-head">
            <div>
              <div className="c-eyebrow">C · 分发矩阵</div>
              <h1>全平台分发矩阵</h1>
              <p>以内容 × 平台为轴：格子即状态与新鲜度。选中任一格子，右侧聚焦动作台不离开矩阵上下文。</p>
            </div>
            <div className="c-head-stats">
              <div className="c-stat"><strong>{matrixRows.length}</strong><span>内容 / 版本</span></div>
              <div className="c-stat"><strong>{PLATFORMS.length}</strong><span>平台账号</span></div>
              <div className="c-stat c-stat--warn"><strong>{visibleAnomalies.length}</strong><span>矩阵异常</span></div>
            </div>
          </div>

          <div className="c-controls">
            <div className="c-chips">
              <ChipFilter label="全部" count={totalCells} pressed={activeFilter === 'all'} size="sm"
                onToggle={() => setActiveFilter('all')} />
              {FILTER_ORDER.map((fk) => (
                <ChipFilter key={fk} label={STATE_META[fk].label} count={countState(fk)}
                  pressed={activeFilter === fk} size="sm"
                  onToggle={() => toggleFilter(fk)} />
              ))}
              <ChipFilter label="仅异常" count={visibleAnomalies.length} pressed={anomOnly} size="sm"
                onToggle={() => setAnomOnly(!anomOnly)} />
            </div>
            <div className="c-scan">
              <span className="c-scan-hint">{scanning ? '扫描中…' : 'F9 · 侦察'}</span>
              <Button variant="secondary" size="sm" disabled={scanning} onClick={runScan}>扫描矩阵</Button>
            </div>
          </div>

          <div className="c-strip">
            <span className="c-strip-label">矩阵侦察</span>
            <div className="c-strip-scroll">
              {visibleAnomalies.length === 0 && <span className="c-strip-note">全矩阵无异常</span>}
              {visibleAnomalies.map((a) => (
                <button key={a.id} type="button" className="c-anom" aria-pressed={activeAnomaly === a.id}
                  title={a.detail} onClick={() => toggleAnomaly(a.id)}>
                  <span className="sev" data-sev={a.sev}>{a.sev}</span>
                  <span>{a.title}</span>
                </button>
              ))}
            </div>
            <span className="c-strip-note">{resolvedCount > 0 ? resolvedCount + ' 处已解决 · ' : ''}{visibleAnomalies.length} 处待处理</span>
          </div>

          <div className="c-matrix-scroll" data-testid="task-list">
            <table className="mx">
              <caption className="visually-hidden">内容 × 平台分发矩阵：行是内容与版本，列是平台账号，格子是发布状态与新鲜度</caption>
              <thead>
                <tr>
                  <th className="mx-corner">
                    <span>内容 / 版本</span>
                    <span className="mx-corner-sub">平台 →</span>
                  </th>
                  {PLATFORMS.map((p) => {
                    const pc = pendingCount(p.id);
                    return (
                      <th key={p.id} scope="col">
                        <span className="mx-colname"><i className="c-pdot" data-tone={p.tone} />{p.name}</span>
                        <span className="mx-colacct">{p.acct}</span>
                        <span className={"mx-colstat" + (pc ? " has" : "")}>{pc ? pc + ' 待处理' : '正常'}</span>
                      </th>
                    );
                  })}
                </tr>
              </thead>
              <tbody>
                {matrixRows.map((r) => (
                  <tr key={r.id} data-testid="task-row" data-record-id={r.id}>
                    <th className="mx-rowhead" scope="row">
                      <span className="mx-rowtitle">{r.title}</span>
                      <span className="mx-rowmeta">
                        <span className="ds-grade" data-grade={r.grade}>{r.grade}</span>
                        <span className="mx-version">{r.version}</span>
                      </span>
                    </th>
                    {PLATFORMS.map((p) => {
                      const cell = r.cells[p.id];
                      const key = keyOf(r.id, p.id);
                      if (!cell || cell.st === null) {
                        return <td key={p.id}><div className="cell-empty">—</div></td>;
                      }
                      const meta = STATE_META[cell.st] || STATE_META.published;
                      return (
                        <td key={p.id}>
                          <button type="button" className={cellClasses(key, cell.st)} data-state={cell.st}
                            aria-pressed={selKey === key} onClick={() => selectCell(key)}>
                            <span className="cell-line1">
                              <StatusPill tone={meta.tone}>{meta.label}</StatusPill>
                              {anomKeys.has(key) && <span className="cell-tag">异</span>}
                            </span>
                            <span className="cell-at">{cell.at}</span>
                          </button>
                        </td>
                      );
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </section>

        <aside className="c-stage" data-testid="detail" aria-label="聚焦动作台">
          {selRow && selCell && selMeta ? (
            <React.Fragment>
              <div className="c-stage-head">
                <div className="c-stage-platform">
                  <i className="c-pdot" data-tone={selPlat.tone} />
                  <strong>{selPlat.name}</strong>
                  <span>{selPlat.acct}</span>
                </div>
                <div className="c-stage-pillrow">
                  <StatusPill tone={selMeta.tone}>{selMeta.label}</StatusPill>
                  <span className="c-stage-at">{selCell.at}</span>
                </div>
              </div>
              <div className="c-stage-body">
                <div className="c-stage-title">
                  <h2>{selRow.title}</h2>
                  <span className="meta">{selRow.id} · {selRow.version}</span>
                </div>
                <div className="c-block">
                  <h3>状态说明</h3>
                  <p>{selMeta.desc}</p>
                </div>
                <div className="c-block">
                  <h3>时间线</h3>
                  <div className="c-timeline">
                    {mkLog(selCell).map((row, idx) => (
                      <div key={idx} className="c-tl-row"><time>{row[0]}</time><span>{row[1]}</span></div>
                    ))}
                  </div>
                </div>
                {selAnoms.length > 0 && (
                  <div className="c-block">
                    <h3>关联侦察</h3>
                    <div className="c-anom-refs">
                      {selAnoms.map((a) => (
                        <button key={a.id} type="button" className="c-anom-ref"
                          aria-pressed={activeAnomaly === a.id} onClick={() => toggleAnomaly(a.id)}>
                          <span className="sev" data-sev={a.sev}>{a.sev}</span>
                          <span>{a.title}</span>
                        </button>
                      ))}
                    </div>
                  </div>
                )}
              </div>
              <div className="c-stage-actions">
                {selMeta.action && (
                  <div data-testid="primary-action">
                    <Button variant="primary" onClick={() => openModal(selMeta.action === '查看数据' ? 'published'
                      : selMeta.action === '去授权' ? 'auth'
                      : selMeta.action === '人工发布' ? 'manual'
                      : selMeta.action === '接管处理' ? 'takeover'
                      : selMeta.action === '开始对账' ? 'reconcile'
                      : 'failed')}>{selMeta.action}</Button>
                  </div>
                )}
                <Button variant="text" size="sm" onClick={() => setModalState({ kind: 'preview', key: selKey })}>预览全文</Button>
              </div>
            </React.Fragment>
          ) : (
            <div className="c-stage-body">
              <div className="c-overview">
                <div className="c-block">
                  <h3>聚焦动作台</h3>
                  <p>在矩阵中选中一个格子，这里会显示该平台 × 该内容的状态说明、时间线与对应动作。</p>
                </div>
                <dl className="c-ov-row"><dt>状态</dt><dd>全部六种状态覆盖：待授权、待人工发布、需要接管、待对账、失败、已发布。</dd></dl>
                <dl className="c-ov-row"><dt>动作</dt><dd>主操作随所选格子的状态切换；发布永远由你手动完成。</dd></dl>
                <div className="c-ov-note">按 F9 可重新扫描矩阵；异常格带「异」标记，点击侦察条可高亮关联格子。</div>
              </div>
            </div>
          )}
        </aside>
      </div>

      <AppModal open={modalState !== null} title={modalTitle} size="standard" onRequestClose={closeModal}
        footer={modalFooter} ariaDescription={modalTitle}>
        {modalBody}
      </AppModal>

      <aside className={"c-pi" + (piOpen ? " is-open" : "")} data-testid="pi-panel" aria-hidden={!piOpen} aria-label="Pi 主编助理">
        <div className="ds-pi-head">
          <WmbCreatureMark state={scanning ? 'working' : 'idle'} />
          <span className="ds-pi-title">Pi · 主编助理</span>
        </div>
        <div className="ds-pi-context"><em>聚焦</em><span>{piContextText}</span></div>
        <div className="ds-pi-transcript">
          {piMsgList.map((m, idx) => (
            <div key={idx} className={"ds-pi-msg ds-pi-msg--" + m.role}>{m.text}</div>
          ))}
        </div>
        <div className="ds-pi-composer">
          <textarea value={piDraft} rows={2} placeholder="询问矩阵状态…"
            onChange={(e) => setPiDraft(e.target.value)} />
          <div className="ds-pi-composer-bar">
            <span className="ds-pi-composer-meta">
              <button type="button" className="ds-pi-model-trigger">Pi · 主编助理</button>
            </span>
            <button type="button" className="ds-pi-send" aria-label="发送" onClick={sendPi}>
              <svg viewBox="0 0 24 24"><path d="M22 2 11 13M22 2 15 22l-4-9-9-4Z" /></svg>
            </button>
          </div>
        </div>
      </aside>

      <div className="c-toasts" role="status" aria-live="polite">
        {toastList.map((t) => (
          <div key={t.id} className="c-toast"><i aria-hidden="true" />{t.text}</div>
        ))}
      </div>
    </div>
  );
}

function ReconcileProgress({ onDone }) {
  const STEPS = ['连接平台数据接口', '拉取阅读 / 点赞 / 转发', '与同频道中位线比较', '写入对账记录'];
  const [step, setStep] = React.useState(0);
  React.useEffect(() => {
    if (step >= STEPS.length) {
      const t = setTimeout(onDone, 400);
      return () => clearTimeout(t);
    }
    const t = setTimeout(() => setStep((s) => s + 1), 420);
    return () => clearTimeout(t);
    /* eslint-disable-next-line react-hooks/exhaustive-deps */
  }, [step]);
  return (
    <div className="c-recon-steps">
      {STEPS.map((s, idx) => (
        <div key={s} className={"c-recon-step" + (idx < step ? " done" : (idx === step ? " active" : ""))}>
          <span className="c-recon-dot" />
          <span>{s}</span>
        </div>
      ))}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
