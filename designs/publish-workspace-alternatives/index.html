<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="design_doc_mode" content="canvas" />
  <title>发布工作台 · 三案比较</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="_ds/wemedia-buddy-design-system/tokens/colors.css">
  <link rel="stylesheet" href="_ds/wemedia-buddy-design-system/tokens/typography.css">
  <link rel="stylesheet" href="_ds/wemedia-buddy-design-system/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/wemedia-buddy-design-system/tokens/shape-motion.css">
  <link rel="stylesheet" href="_ds/wemedia-buddy-design-system/styles/components.css">
  <link rel="stylesheet" href="_ds/wemedia-buddy-design-system/styles.css">
  <script src="_ds/wemedia-buddy-design-system/_ds_bundle.js"></script>
  <style>
    *{box-sizing:border-box}
    html,body,#root{margin:0;min-width:1100px;min-height:100%;background:var(--app-bg);color:var(--ink);font-family:var(--font-sans)}
    body{min-height:100vh}
    button,a{font:inherit}
    .shell{min-height:100vh;background:var(--app-bg)}
    .topbar{height:var(--topbar-height);display:flex;align-items:center;gap:var(--space-3);padding:0 var(--space-5);border-bottom:1px solid var(--border-soft);background:var(--topbar-bg);position:sticky;top:0;z-index:10}
    .brand{display:flex;align-items:center;gap:var(--space-3);font-weight:700;letter-spacing:-.02em}.brand-mark{width:26px;height:26px}.crumb{color:var(--muted);font-size:var(--text-sm)}
    .top-actions{margin-left:auto;display:flex;align-items:center;gap:var(--space-2)}
    .main{width:min(1480px,calc(100% - 48px));margin:0 auto;padding:var(--space-7) 0 var(--space-10)}
    .intro{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:var(--space-8);align-items:end;padding:var(--space-4) 0 var(--space-7);border-bottom:1px solid var(--border)}
    .eyebrow{margin:0 0 var(--space-3);color:var(--accent-soft);font-size:var(--text-xs);font-weight:700;letter-spacing:.1em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(34px,4vw,58px);line-height:1;letter-spacing:-.045em;font-weight:700;max-width:760px}
    .lede{margin:var(--space-4) 0 0;color:var(--ink-soft);font-size:var(--text-lg);line-height:1.65;max-width:760px}
    .brief{border-left:2px solid var(--accent);padding-left:var(--space-5)}
    .brief strong{display:block;margin-bottom:var(--space-2);font-size:var(--text-base)}
    .brief p{margin:0;color:var(--muted);line-height:1.7;font-size:var(--text-sm)}
    .contract{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--border);padding:var(--space-5) 0}
    .contract-item{padding:0 var(--space-4);border-right:1px solid var(--border-soft)}.contract-item:first-child{padding-left:0}.contract-item:last-child{border-right:0}
    .contract-label{display:block;color:var(--muted-low);font-size:var(--text-xs);letter-spacing:.08em;text-transform:uppercase;margin-bottom:var(--space-2)}
    .contract-value{display:block;color:var(--ink-soft);font-size:var(--text-sm);line-height:1.5}
    .section-head{display:flex;justify-content:space-between;align-items:end;margin:var(--space-8) 0 var(--space-4)}
    .section-head h2{margin:0;font-size:var(--text-xl);letter-spacing:-.02em}.section-head p{margin:0;color:var(--muted);font-size:var(--text-sm)}
    .options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--border);background:var(--surface)}
    .option{min-width:0;padding:var(--space-6);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:530px;transition:background var(--dur-base) var(--ease-base)}
    .option:last-child{border-right:0}.option:hover{background:var(--surface-raised)}
    .option-letter{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--border-strong);font-family:var(--mono);font-weight:700;margin-bottom:var(--space-5)}
    .option[data-tone="bold"] .option-letter{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
    .option-kicker{color:var(--muted);font-size:var(--text-xs);letter-spacing:.08em;text-transform:uppercase;margin-bottom:var(--space-2)}
    .option h3{margin:0;font-size:var(--text-xl);letter-spacing:-.025em}.option-desc{margin:var(--space-3) 0 var(--space-5);color:var(--ink-soft);line-height:1.65;min-height:68px}
    .wire{height:166px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);display:grid;margin-bottom:var(--space-5);background:var(--workspace-bg);padding:var(--space-3);gap:var(--space-2)}
    .wire span{display:block;border:1px solid var(--border-soft);background:var(--panel-bg)}
    .wire-a{grid-template-columns:28% 47% 25%;grid-template-rows:1fr}.wire-a span:nth-child(2){background:var(--surface-raised)}
    .wire-b{grid-template-columns:1fr;grid-template-rows:26px 1fr 34px}.wire-b span:nth-child(2){background:var(--surface-raised)}
    .wire-c{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr)}.wire-c span:nth-child(3),.wire-c span:nth-child(6),.wire-c span:nth-child(10){border-color:var(--accent);background:var(--accent-faint)}
    .strengths{margin:0 0 var(--space-6);padding:0;list-style:none;display:grid;gap:var(--space-3);color:var(--ink-soft);font-size:var(--text-sm)}
    .strengths li{display:grid;grid-template-columns:72px 1fr;gap:var(--space-3);align-items:baseline}.strengths b{color:var(--muted);font-size:var(--text-xs);font-weight:600}.strengths span{line-height:1.45}
    .open-link{margin-top:auto;display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 var(--space-4);border:1px solid var(--border-strong);color:var(--ink);text-decoration:none;font-weight:650;transition:background var(--dur-base) var(--ease-base),border-color var(--dur-base) var(--ease-base)}
    .open-link:hover,.open-link:focus-visible{background:var(--surface-hover);border-color:var(--accent);outline:none}.option[data-tone="bold"] .open-link{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
    .compare{width:100%;border-collapse:collapse;border:1px solid var(--border);background:var(--surface);font-size:var(--text-sm)}
    .compare th,.compare td{text-align:left;padding:var(--space-4);border-bottom:1px solid var(--border-soft);border-right:1px solid var(--border-soft)}
    .compare th{color:var(--muted);font-size:var(--text-xs);letter-spacing:.05em;text-transform:uppercase;background:var(--panel-bg)}.compare td:first-child{font-weight:650;color:var(--ink)}.compare tr:last-child td{border-bottom:0}
    .score{font-family:var(--mono);letter-spacing:.12em;color:var(--accent-soft)}
    .footer-note{display:flex;justify-content:space-between;gap:var(--space-6);margin-top:var(--space-7);padding-top:var(--space-5);border-top:1px solid var(--border);color:var(--muted);font-size:var(--text-sm);line-height:1.6}
    @media(max-width:1279px){.main{width:calc(100% - 32px)}.intro{grid-template-columns:1fr 300px;gap:var(--space-5)}.option{padding:var(--space-4)}.option-desc{min-height:92px}.strengths li{grid-template-columns:60px 1fr}.contract{grid-template-columns:repeat(2,1fr);row-gap:var(--space-5)}.contract-item:nth-child(2){border-right:0}.contract-item:nth-child(3){padding-left:0}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel">
    const WmbDS = window.WemediaBuddyDesignSystem_1c877c;
    const { Button, WmbCreatureMark } = WmbDS;
    const schemes = [
      {id:'A',title:'队列总控',kicker:'Operational ledger',href:'queue-control.html',desc:'把六类发布状态压进一条可扫描的任务账本。选择即展开行动面，异常与日常任务同一套语法。',layout:'wire-a',strengths:[['最强项','快速扫盘'],['主对象','发布任务'],['工作方式','先找异常，再处理单项'],['风险','终审内容空间相对克制']]},
      {id:'B',title:'沉浸终审',kicker:'Editorial proofing',href:'immersive-review.html',desc:'保留全平台收件匣，但把当前稿件、平台预览与素材证据放大。状态动作成为稳定的底部签发条。',layout:'wire-b',strengths:[['最强项','单稿终审'],['主对象','当前稿件'],['工作方式','逐稿核对，队列随时切换'],['风险','跨平台异常对比略慢']]},
      {id:'C',title:'分发矩阵',kicker:'Distribution map',href:'distribution-matrix.html',desc:'以内容 × 平台单元格呈现整个发布面。异常像断点一样显露，选中后不离开总盘完成处置。',layout:'wire-c',strengths:[['最强项','跨平台比较'],['主对象','内容 × 平台'],['工作方式','从分布看断点，再落到行动'],['风险','学习成本最高']]}
    ];
    function Wire({type}){return <div className={'wire '+type} aria-hidden="true">{Array.from({length:type==='wire-c'?12:type==='wire-b'?3:3},(_,i)=><span key={i}/>)}</div>}
    function App(){
      const [themeMode,setThemeMode]=React.useState('dark');
      const toggleTheme=()=>{const next=themeMode==='dark'?'light':'dark';setThemeMode(next);document.documentElement.dataset.theme=next;};
      return <div className="shell">
        <header className="topbar"><div className="brand"><span className="brand-mark"><WmbCreatureMark state="idle" /></span><span>WeMediaBuddy</span></div><span className="crumb">设计评审 / 发布工作台</span><div className="top-actions"><Button variant="text" size="sm" onClick={toggleTheme}>{themeMode==='dark'?'切到白昼':'切到墨夜'}</Button></div></header>
        <main className="main">
          <section className="intro"><div><p className="eyebrow">WMB-5262 · Prototype comparison</p><h1>同一套发布状态，三种工作台模型。</h1><p className="lede">这次不再微调旧三栏。三案从「如何看见全部平台、如何终审单稿、如何处置异常」重新分配空间和操作重心。</p></div><aside className="brief"><strong>共同边界</strong><p>最终发布仍由 Owner 手工确认。Pi 默认收起。三案都覆盖完整六态，不修改现有发布协议。</p></aside></section>
          <section className="contract" aria-label="共同设计合同">
            <div className="contract-item"><span className="contract-label">主轴</span><span className="contract-value">全部平台任务总盘</span></div>
            <div className="contract-item"><span className="contract-label">状态链</span><span className="contract-value">授权 · 人工 · 接管 · 对账 · 失败 · 已发布</span></div>
            <div className="contract-item"><span className="contract-label">比较重点</span><span className="contract-value">扫盘 / 终审 / 异常处置</span></div>
            <div className="contract-item"><span className="contract-label">Pi</span><span className="contract-value">默认收起，按需覆盖展开</span></div>
          </section>
          <div className="section-head"><h2>三个方向</h2><p>进入独立页面可体验完整状态动作。</p></div>
          <section className="options">
            {schemes.map((scheme)=><article className="option" data-tone={scheme.id==='C'?'bold':'restrained'} key={scheme.id}>
              <div className="option-letter">{scheme.id}</div><div className="option-kicker">{scheme.kicker}</div><h3>{scheme.title}</h3><p className="option-desc">{scheme.desc}</p><Wire type={scheme.layout}/>
              <ul className="strengths">{scheme.strengths.map(([label,value])=><li key={label}><b>{label}</b><span>{value}</span></li>)}</ul>
              <a className="open-link" href={scheme.href}>打开 {scheme.id} 案</a>
            </article>)}
          </section>
          <div className="section-head"><h2>取舍矩阵</h2><p>评分只用于比较模型，不代表最终视觉完成度。</p></div>
          <table className="compare"><thead><tr><th>评审维度</th><th>A · 队列总控</th><th>B · 沉浸终审</th><th>C · 分发矩阵</th></tr></thead><tbody>
            <tr><td>扫盘效率</td><td className="score">●●●●●</td><td className="score">●●●○○</td><td className="score">●●●●○</td></tr>
            <tr><td>单稿终审</td><td className="score">●●●○○</td><td className="score">●●●●●</td><td className="score">●●●○○</td></tr>
            <tr><td>异常定位</td><td className="score">●●●●○</td><td className="score">●●●○○</td><td className="score">●●●●●</td></tr>
            <tr><td>上手成本</td><td>低</td><td>低</td><td>中</td></tr>
            <tr><td>适合高峰</td><td>任务量大、异常混杂</td><td>少量高价值长稿</td><td>一稿多投、跨账号分发</td></tr>
          </tbody></table>
          <footer className="footer-note"><span>先看结构，不急着决定细节。可选一个方案，也可明确组合，例如「A 的队列 + B 的终审画布」。</span><span>原型范围：仅发布页</span></footer>
        </main>
      </div>
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
