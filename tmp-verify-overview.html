<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --border:#363636;
  --surface-raised:#1c1c1c;
  --surface:#171717;
  --surface-hover:#242424;
  --border-strong:#484848;
  --ink:#f1f1f1;
  --muted:#aaaaaa;
  --muted-low:#767676;
  --accent:#8b7cff;
  --success:#4cc38a;
  --danger:#e5636f;
  --amber:#f0b45a;
  --border:#363636;
}
body{margin:0;padding:24px;background:#0b0b0b;font-family:Inter, sans-serif;}
/* import styles */
.today-overview{border:1px solid var(--border);border-radius:11px;background:var(--surface-raised);padding:14px 16px 12px;display:grid;gap:12px;max-width:1200px;margin:auto}
.today-overview-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.today-overview-title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0}
.today-overview-title h2{margin:0;font-size:15px;font-weight:700;color:var(--ink)}
.today-overview-updated{border:0;background:transparent;color:var(--muted-low);font-size:11.5px;cursor:pointer;padding:2px 6px;border-radius:6px}
.today-overview-updated:hover{background:var(--surface-hover);color:var(--muted)}
.today-overview-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex-shrink:0}
.secondary-button{border:1px solid var(--border-strong);background:var(--surface-raised);color:var(--ink);padding:8px 14px;border-radius:7px;font-size:13px}
.primary-button{border:0;background:var(--accent);color:#fff;padding:8px 14px;border-radius:7px;font-size:13px}
.today-overview-detail{margin:0;color:var(--muted);font-size:12.5px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-basis:100%;width:100%;min-width:0}
.today-overview-run{display:grid;gap:8px}
.today-overview-run .intelligence-bar{margin-top:0}
.today-overview-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:1100px){.today-overview-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.today-overview-metrics{grid-template-columns:1fr}}
.today-metric{border:1px solid var(--border);border-radius:9px;background:var(--surface);padding:10px 12px 8px;display:grid;gap:4px;text-align:left;cursor:pointer;min-width:0}
.today-metric:hover{border-color:var(--border-strong);background:var(--surface-hover)}
.today-metric-label{color:var(--muted-low);font-size:11px;font-weight:700;letter-spacing:.4px}
.today-metric-value{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1}
.today-metric-change{font-size:11.5px;color:var(--muted-low);min-height:14px}
.today-metric-trend{height:28px;display:grid;align-items:center}
.intelligence-bar{height:8px;border-radius:999px;background:color-mix(in srgb, var(--border) 80%, transparent);overflow:hidden}
.intelligence-bar > i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg, color-mix(in srgb, var(--amber) 78%, #fff), var(--amber));transition:width 280ms ease}
</style>
</head>
<body>
<section class="today-overview" aria-label="今日经营概况">
  <div class="today-overview-head">
    <div class="today-overview-title">
      <h2>今日经营概况</h2>
      <button type="button" class="today-overview-updated">更新于 2026/8/24 22:30:00</button>
      <span style="color: var(--accent); font-size:12px">正在评估新资料并更新选题池</span>
    </div>
    <div class="today-overview-actions">
      <button type="button" class="secondary-button">查看资料</button>
      <button type="button" class="primary-button">去创作</button>
    </div>
    <p class="today-overview-detail" aria-live="polite" aria-atomic="true">扫描已完成，正在判断新资料是否值得进入选题池</p>
  </div>
  <div class="today-overview-run">
    <div class="intelligence-bar" data-indeterminate="true" aria-label="正在更新选题池"><i style="width:36%"></i></div>
  </div>
  <div class="today-overview-metrics" role="group" aria-label="经营指标">
    <button type="button" class="today-metric"><span class="today-metric-label">今日新资料</span><span class="today-metric-value">12</span><span class="today-metric-change">较昨日 +3</span><span class="today-metric-trend"></span></button>
    <button type="button" class="today-metric"><span class="today-metric-label">内容机会</span><span class="today-metric-value">4</span><span class="today-metric-change">较昨日 +1</span><span class="today-metric-trend"></span></button>
    <button type="button" class="today-metric"><span class="today-metric-label">进行中项目</span><span class="today-metric-value">2</span><span class="today-metric-change">—</span><span class="today-metric-trend"></span></button>
    <button type="button" class="today-metric"><span class="today-metric-label">近 7 日发布</span><span class="today-metric-value">5</span><span class="today-metric-change">较上周 +2</span><span class="today-metric-trend"></span></button>
  </div>
</section>
</body>
</html>
